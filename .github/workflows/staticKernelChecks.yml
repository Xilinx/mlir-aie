name: Static Kernel Checks (Peano remarks)

# CPU-only. Compiles every library kernel with Peano remark flags
# (python -m aie.utils.compile.remarks) and records per-loop II and
# zero-overhead status, program memory, missing-bank loads and dropped-pragma
# warnings. Never gates; comments on same-repo PRs only when a series
# regressed; nothing on failure.
#
# SOFT RELEASE: manual (workflow_dispatch) only while this settles. The
# nightly and PR triggers below are commented out, not deleted -- restoring
# them is uncommenting the two blocks. Until then nothing records a baseline
# on a schedule, so the first manual runs are what seed it.
#
# The job builds the checkout, as benchmarkKernels.yml does. It used to
# install the published wheel and copy the checkout's pure-Python packages
# over it, which meant a PR touching the compiled bindings could not be
# checked until the next nightly wheel, and the list of packages to copy had
# to be maintained by hand against every refactor.

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
  # --- soft release: re-enable together when this is trusted ---------------
  # schedule:
  #   - cron: '30 5 * * *'
  # pull_request:
  #   paths:
  #     - utils/peano-requirements.txt        # the Peano pin: the primary trigger
  #     - aie_kernels/**                      # what is compiled
  #     - aie_runtime_lib/**                  # lut_based_ops.cpp behind the aie2 LUT kernels
  #     - python/iron/kernels/**              # which source, which flags
  #     - python/iron/algorithms/kernel_design.py  # the designs the sweep builds
  #     - python/utils/compile/remarks.py     # the checker
  #     - test/python/npu/kernel_cases.py     # the case table the compile sweep walks
  #     - test/python/test_remarks.py
  #     - .github/workflows/staticKernelChecks.yml

defaults:
  run:
    shell: bash

jobs:
  static:
    name: static (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aie2
            device: npu1
          - target: aie2p
            device: npu2
    env:
      MLIR_AIE_KERNEL_SOURCES: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: '3.12' }
      - name: Install Peano and build dependencies
        run: source ./utils/env_install.sh aie-venv --dev --extras

      - name: Build from source
        run: |
          source aie-venv/bin/activate
          export EXTRA_CMAKE_ARGS="-DPython3_EXECUTABLE=$(which python) \
            -DAIE_ENABLE_PYTHON_PASSES=OFF -DAIE_ENABLE_XRT_PYTHON_BINDINGS=OFF"
          ./utils/build-mlir-aie-from-wheels.sh "" build mlir_aie
          # Export the venv and the built tree once; the steps below are
          # plain `python -m ...` and inherit both.
          source utils/env_setup.sh mlir_aie
          echo "$PWD/aie-venv/bin" >> "$GITHUB_PATH"
          {
            echo "PYTHONPATH=$PYTHONPATH"
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
            echo "MLIR_AIE_INSTALL_DIR=$MLIR_AIE_INSTALL_DIR"
          } >> "$GITHUB_ENV"
          echo "$PWD/mlir_aie/bin" >> "$GITHUB_PATH"

      - name: Check the built tree is the one under test
        # Cheap and specific: import what the suite drives and print where it
        # came from. A build that silently resolved to some other aie package,
        # or a module this PR added that never got staged, fails here with a
        # readable error instead of somewhere inside a compile sweep.
        run: |
          python - <<'EOF'
          import aie, aie.iron, aie.iron.algorithms.kernel_design as kd
          from aie.iron import kernels
          root = aie.__path__[0]
          assert root.startswith("${{ github.workspace }}"), root
          print("aie package:", root)
          print("design builder:", kd.design.__module__)
          print("factories:", len(kernels.__all__))
          EOF

      - name: Run static analysis
        id: static
        run: |
          python -m aie.utils.compile.remarks --target ${{ matrix.target }} \
            --out static.json --out-pm static-pm.json --meta static-meta.json 2>&1 | tee static.log
      - name: Host-only tests
        # The remark parser (with one real Peano build), and every contract
        # against its factory.
        run: |
          python -m pytest test/python/test_remarks.py \
            test/python/test_kernel_contracts.py test/test_kernel_workflows.py -q
      - name: Compile every distinct design through CDO
        # The same aiecc pipeline the device runs, minus xclbin packaging
        # (needs XRT). Catches tile sets that overflow core memory and DMA
        # patterns the hardware cannot express, plus fused epilogue sources.
        run: |
          python -m pytest test/python/npu/test_kernels_compile.py \
            test/python/npu/test_fused_mm_compile.py -m extensive -q -x
        env:
          KERNEL_TEST_DEVICE: ${{ matrix.device }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: static-${{ matrix.target }}-${{ github.run_id }}
          path: |
            static.json
            static-pm.json
            static-meta.json
            static.log
          if-no-files-found: ignore

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: github.event_name == 'pull_request' && hashFiles('static.json') != ''
        with:
          path: baseline
          key: static-baseline-${{ matrix.target }}-
          restore-keys: static-baseline-${{ matrix.target }}-
      - name: Compare (PR)
        # Needs a nightly baseline in the cache; the first runs have none.
        if: github.event_name == 'pull_request' && hashFiles('static.json') != '' && hashFiles('baseline/benchmark-data.json') != ''
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba  # v1.22.1
        with:
          name: static (${{ matrix.target }})
          tool: customSmallerIsBetter
          output-file-path: static.json
          external-data-json-path: baseline/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: '101%'
          # A fork PR's token cannot comment; the job summary still carries the table.
          comment-on-alert: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          summary-always: true
          fail-on-alert: false
          save-data-file: false

      # Program memory is a step function -- a loop that stops fitting, an
      # inlining decision that flips -- so it needs more slack than II, which
      # moves by whole cycles. 3% catches a real regression without firing on
      # a kernel that gained one instruction.
      - name: Compare program memory against the baseline (PR only)
        if: github.event_name == 'pull_request' && hashFiles('static-pm.json') != '' && hashFiles('baseline/benchmark-data-pm.json') != ''
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba  # v1.22.1
        with:
          name: static pm (${{ matrix.target }})
          tool: customSmallerIsBetter
          output-file-path: static-pm.json
          external-data-json-path: baseline/benchmark-data-pm.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: '103%'
          comment-on-alert: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          summary-always: true
          fail-on-alert: false
          save-data-file: false

  publish:
    needs: static
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/publishKernelResults.yml
    with:
      static: true
