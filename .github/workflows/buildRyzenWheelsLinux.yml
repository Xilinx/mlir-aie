            source ${{ github.workspace }}/aie-venv/bin/activate

            echo "Installing vitis_aie_essentials ..."
            pushd /opt
            tar xfz /workspace/vaie.tgz
            popd

            pip install --upgrade pip
            pip install -r python/requirements_ml.txt
            python -m pip install --require-hashes -r python/requirements_dev.lock

            # This container's XRT does not ship aiebu's library, so build it for
            # aiecc to link (in-process ELF assembly, no aiebu-asm needed). Pinned
            # to the aiebu submodule of XRT 2.25.0 so the ELFs match its aiebu-asm.
