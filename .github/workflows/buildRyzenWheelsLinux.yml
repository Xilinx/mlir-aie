            if [ x"$ENABLE_RTTI" == x"OFF" ]; then
              NO_RTTI="-no-rtti"
              NO_RTTI_UNDERSCORE="_no_rtti"
            fi
            VERSION=$(utils/clone-llvm.sh --get-wheel-version)
            for attempt in 1 2 3; do
