name: Warm Windows OpenSSL cache

# slproweb.com (the official source for the Windows OpenSSL installer) was
# observed serving it at a throttled ~50KB/s from the devlab-dispatch runner
# pool's network path, making a cold cache fill take ~85min - see the "Cache
# Windows OpenSSL" / "Ensure Windows OpenSSL" steps in
# buildAndTestRyzenAIWindows.yml for the full story. That cache entry is
# keyed on a pinned version+sha256 that changes rarely, so it should almost
# never need refilling - but restoring a cache entry also resets its
# 7-day-unused eviction clock, and GH Actions cache keys are immutable, so
# proactively restoring it weekly is a cheap no-op on a hit and insurance
# against both that eviction and any quota-driven LRU eviction, without ever
# making a PR's CI run pay the ~85min cold-fill cost inline.
#
# NOTE: the two steps below are intentionally duplicated from
# buildAndTestRyzenAIWindows.yml rather than factored into a shared
# composite action, to avoid touching that workflow (and retriggering its
# concurrency-cancelled runs) while its OpenSSL fixes are still being
# validated. Keep both copies in sync if the pinned version/hash changes.
on:
  schedule:
    # Saturdays ~03:17 UTC - weekly, off-peak. This cache should basically
    # never need refilling, so weekly is just insurance.
    - cron: '17 3 * * 6'
  workflow_dispatch: {}

jobs:
  warm-openssl-cache:
    runs-on: [self-hosted, windows, devlab-dispatch, strix-halo]
    # Only exercised end-to-end on a genuine cache miss; see
    # buildAndTestRyzenAIWindows.yml for the same ~85min budget rationale.
    timeout-minutes: 180
    steps:
      - name: Cache Windows OpenSSL
        uses: actions/cache@v4
        with:
          path: C:\OpenSSL-Win64
          key: openssl-win64-4_0_3-0f5436092d1303db9052d3c114fbc6326abe0276861619e26da5156ddf7ca087

      - name: Ensure Windows OpenSSL
        shell: cmd
        run: |
          if exist "C:\OpenSSL-Win64\lib\VC\x64\MT\libcrypto_static.lib" goto :openssl_ready

          echo OpenSSL not found in cache - downloading it
          set "OPENSSL_EXE=Win64OpenSSL-4_0_3.exe"
          set "OPENSSL_SHA256=0f5436092d1303db9052d3c114fbc6326abe0276861619e26da5156ddf7ca087"
          if exist "%OPENSSL_EXE%" del /f /q "%OPENSSL_EXE%"
          curl.exe --fail --location --connect-timeout 15 --max-time 1500 --retry 8 --retry-all-errors --retry-delay 10 -C - -o "%OPENSSL_EXE%" "https://slproweb.com/download/%OPENSSL_EXE%"
          if errorlevel 1 exit /b 1

          python -c "import hashlib,sys; h = hashlib.sha256(open(r'%OPENSSL_EXE%', 'rb').read()).hexdigest(); sys.exit(0 if h == '%OPENSSL_SHA256%' else 1)"
          if errorlevel 1 (
            echo ##[error]%OPENSSL_EXE% sha256 mismatch - refusing to run an unverified installer
            exit /b 1
          )

          "%OPENSSL_EXE%" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="C:\OpenSSL-Win64"
          if errorlevel 1 exit /b 1
          del /f /q "%OPENSSL_EXE%"

          if not exist "C:\OpenSSL-Win64\lib\VC\x64\MT\libcrypto_static.lib" (
            echo ##[error]C:\OpenSSL-Win64\lib\VC\x64\MT\libcrypto_static.lib still missing after running %OPENSSL_EXE% - installer may require elevation on this runner, or may not be the full non-Light package
            exit /b 1
          )
          exit /b 0

          :openssl_ready
          echo Using existing C:\OpenSSL-Win64
