# The allocator's and router's model-based tests, at a scale too slow for
# check-aie. The nightly publishes to component-checks/{allocator,router}/,
# failures included (the dashboard's Placement and Routing).

name: Model-based tests

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      allocator_seeds:
        description: 'Designs for allocator_properties.py --seeds (default 5000); any input set means the run never publishes'
        default: ''
      allocator_bankres_seeds:
        description: 'Designs for allocator_properties.py --bankres-seeds (default 200000, at least 12000)'
        default: ''
      router_seeds:
        description: 'Routable designs per device for router_properties.py --seeds (default 2000)'
        default: ''
      mutation_seeds:
        description: 'Routable designs per device and hop setting for router_mutation.py --seeds (default 400)'
        default: ''
      first_seed:
        description: 'First router seed (--first-seed); empty picks a new range each day'
        default: ''
  schedule:
    - cron: '17 3 * * *'

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive
  ALLOCATOR_SEEDS: ${{ inputs.allocator_seeds || '5000' }}
  ALLOCATOR_BANKRES_SEEDS: ${{ inputs.allocator_bankres_seeds || '200000' }}
  ROUTER_SEEDS: ${{ inputs.router_seeds || '2000' }}
  MUTATION_SEEDS: ${{ inputs.mutation_seeds || '400' }}

concurrency:
  group: model-based-tests-${{ github.ref }}
  # Only the nightly cancels a run in progress; a dispatch queues behind the
  # nightly instead of cancelling its publish.
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

jobs:
  build:
    name: Build, allocator and router lit tests

    runs-on: ubuntu-26.04
    timeout-minutes: 90

    outputs:
      first_seed: ${{ steps.seeds.outputs.first_seed }}
      tools: ${{ steps.pack.outcome }}

    steps:
      - name: Get the project repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
          submodules: "true"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python utils/mlir_aie_wheels/vendor_eudsl.py \
              --requirements python/requirements.txt \
              --install-non-eudsl
          python -m pip install --require-hashes -r python/requirements_dev.lock

      - name: Setup Cpp
        uses: aminya/setup-cpp@15a6bd8cf39030f88b5da3d203a829ec4eea4955  # v1.10.1
        with:
          compiler: llvm
          cmake: true
          ninja: true
          cppcheck: false
          clangtidy: false
          clangformat: false

      # Shares the cache of the matching buildAndTestMulti.yml configuration.
      - uses: ./.github/actions/setup_ccache
        id: setup_ccache
        with:
          MATRIX_OS: ubuntu-26.04
          MATRIX_ARCH: x86
          EXTRA_KEY: compile-and-test-llvm-assert=ON-rtti=ON

      - name: Get MLIR
        run: |
          VERSION=$(utils/clone-llvm.sh --get-wheel-version)
          for attempt in 1 2 3; do
            rm -f mlir-*.whl
            if pip -q download mlir==$VERSION \
              -f https://github.com/Xilinx/mlir-aie/releases/expanded_assets/mlir-distro; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to download MLIR wheel after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          unzip -q mlir-*.whl

      # Assertions on, so the router test also reads the router's DEBUG_ONLY
      # output and measures route-space coverage of its internals.
      - name: Build
        id: build
        run: |
          mkdir -p build_release/install
          cd build_release
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PWD/install \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PLATFORM_NO_VERSIONED_SONAME=ON \
            -DCMAKE_VISIBILITY_INLINES_HIDDEN=ON \
            -DCMAKE_C_VISIBILITY_PRESET=hidden \
            -DCMAKE_CXX_VISIBILITY_PRESET=hidden \
            -DAIE_COMPILER=NONE \
            -DAIE_LINKER=NONE \
            -DAIE_ENABLE_PYTHON_PASSES=OFF \
            -DHOST_COMPILER=NONE \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_ENABLE_RTTI=ON \
            -DCMAKE_MODULE_PATH=$PWD/../cmake/modulesXilinx \
            -DMLIR_DIR=$PWD/../mlir/lib/cmake/mlir \
            -DLLVM_DIR=$PWD/../mlir/lib/cmake/llvm \
            -DLLVM_EXTERNAL_LIT="$(which lit)"
          ninja
          echo "$PWD/bin" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$PWD/python" >> "$GITHUB_ENV"

      # The router's tools for the jobs below: aie-opt, and the aie package
      # with its symlinks (into the checkout and the MLIR wheel) followed.
      - name: Pack the router's tools
        id: pack
        if: ${{ steps.build.outcome == 'success' }}
        run: tar -czhf router-tools.tar.gz build_release/bin/aie-opt build_release/python

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ steps.pack.outcome == 'success' }}
        with:
          name: model-based-tools-${{ github.run_id }}
          path: router-tools.tar.gz
          retention-days: 1

      # A fixed range would test the same designs every night; each day gets
      # its own, logged here so a failure can be rerun with --first-seed.
      - name: Pick router seeds
        id: seeds
        env:
          FIRST_SEED: ${{ inputs.first_seed }}
        run: |
          if [ -z "$FIRST_SEED" ]; then
            FIRST_SEED=$(( $(date -u +%s) / 86400 * 10000 ))
          fi
          echo "First seed: $FIRST_SEED"
          echo "first_seed=$FIRST_SEED" >> "$GITHUB_OUTPUT"
          mkdir -p results/allocator/reports results/router/reports

      # Exits nonzero on any REGRESSION line, and names the seeds it could not
      # solve.
      - name: Allocator
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          python test/assign-buffer-addresses/allocator_properties.py \
            --seeds "$ALLOCATOR_SEEDS" --bankres-seeds "$ALLOCATOR_BANKRES_SEEDS" \
            --report results/allocator/reports/allocator.json

      - name: Router nightly lit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          lit -sv -D router_nightly=1 -o results/router/reports/lit.json \
            build_release/test/create-packet-flows/nightly

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: model-based-results-build-${{ github.run_id }}
          path: results/
          if-no-files-found: ignore

  # Failing designs go to results/router/failures/. xcvc1902 routes about ten
  # times slower, so it runs a quarter of the seeds.
  router:
    name: Router ${{ matrix.run }}, ${{ matrix.device }}
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.tools == 'success' }}

    runs-on: ubuntu-26.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        device: [npu1, npu2, xcvc1902]
        run: [properties, hops-on, hops-off]

    env:
      FIRST_SEED: ${{ needs.build.outputs.first_seed }}

    steps:
      - name: Get the project repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python utils/mlir_aie_wheels/vendor_eudsl.py \
              --requirements python/requirements.txt \
              --install-non-eudsl
          python -m pip install --require-hashes -r python/requirements_dev.lock

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: model-based-tools-${{ github.run_id }}

      - name: Unpack the router's tools
        run: |
          tar -xzf router-tools.tar.gz
          echo "$PWD/build_release/bin" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$PWD/build_release/python" >> "$GITHUB_ENV"

      - name: Router ${{ matrix.run }}, ${{ matrix.device }}
        timeout-minutes: 100
        env:
          DEVICE: ${{ matrix.device }}
          RUN: ${{ matrix.run }}
        run: |
          mkdir -p results/router/reports
          out="results/router/failures/$DEVICE-$RUN"
          report="results/router/reports/$DEVICE-$RUN.json"
          if [ "$RUN" = properties ]; then
            seeds=$ROUTER_SEEDS
            [ "$DEVICE" = xcvc1902 ] && seeds=$((ROUTER_SEEDS / 4))
            python test/create-packet-flows/nightly/router_properties.py --device "$DEVICE" \
              --seeds "$seeds" --first-seed "$FIRST_SEED" --out "$out" --report "$report"
          else
            seeds=$MUTATION_SEEDS
            [ "$DEVICE" = xcvc1902 ] && seeds=$((MUTATION_SEEDS / 4))
            flag=()
            [ "$RUN" = hops-off ] && flag=(--hops-off)
            python utils/router_testing/router_mutation.py --device "$DEVICE" "${flag[@]}" \
              --seeds "$seeds" --first-seed "$FIRST_SEED" --jobs "$(nproc)" \
              --out "$out" --shrink --repros "$out/repros" --report "$report"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: model-based-results-${{ matrix.device }}-${{ matrix.run }}-${{ github.run_id }}
          path: results/
          if-no-files-found: ignore

  # Every report the jobs above should have written; one that is missing
  # (its job failed, timed out or never ran) is recorded as a failure.
  collect:
    name: Collect results
    needs: [build, router]
    if: always()

    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: model-based-results-*-${{ github.run_id }}
          path: results
          merge-multiple: true

      - name: Collect results
        run: |
          mkdir -p results/allocator results/router
          python utils/component_checks/model_based.py allocator \
            --report results/allocator/reports/allocator.json \
            --out results/allocator/perf.json --meta results/allocator/meta.json || status=1
          reports=()
          for device in npu1 npu2 xcvc1902; do
            for run in properties hops-on hops-off; do
              reports+=(--report "results/router/reports/$device-$run.json")
            done
          done
          python utils/component_checks/model_based.py router "${reports[@]}" \
            --lit results/router/reports/lit.json \
            --out results/router/perf.json --meta results/router/meta.json || status=1
          exit "${status:-0}"

      - name: Upload the allocator's results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: component-checks-allocator-${{ github.run_id }}
          path: results/allocator/
          if-no-files-found: ignore

      - name: Upload the router's results and failing designs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: component-checks-router-${{ github.run_id }}
          path: results/router/
          if-no-files-found: ignore

  publish:
    needs: [collect]
    # The nightly, or a dispatch on main with every input left at its default.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
      && !(inputs.allocator_seeds || inputs.allocator_bankres_seeds
      || inputs.router_seeds || inputs.mutation_seeds || inputs.first_seed) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: read  # the workflow's runs, to date each record by its start
    # The lock every gh-pages writer takes; a run queues behind the others
    # rather than racing them on the branch.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
      queue: max
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: component-checks-allocator-${{ github.run_id }}
          path: results/allocator
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: component-checks-router-${{ github.run_id }}
          path: results/router

      - name: List the workflow's runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow=${GITHUB_WORKFLOW_REF%@*}
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/${workflow##*/}/runs?per_page=100" \
            --paginate --jq '.workflow_runs[] | {id, event, run_started_at}' \
            > "$RUNNER_TEMP/runs.jsonl" ||
            echo "::warning::could not list the workflow's runs; records are dated when published"
          started=$(jq -r --argjson id "$GITHUB_RUN_ID" 'select(.id == $id) | .run_started_at' \
            "$RUNNER_TEMP/runs.jsonl" 2>/dev/null || true)
          echo "RUN_STARTED_AT=$started" >> "$GITHUB_ENV"

      - name: Fetch publication branch
        run: git fetch origin gh-pages:gh-pages --depth=1

      # One directory per check, as nightlyComponentChecks.yml's. The
      # dashboard is published too, so it is there whichever nightly
      # publishes first.
      - name: Publish results
        run: |
          cp utils/kernel_checks/index.html "$RUNNER_TEMP/index.html"
          cp utils/kernel_checks/publish.py "$RUNNER_TEMP/publish.py"
          git switch -q gh-pages
          mkdir -p dashboard
          cp "$RUNNER_TEMP/index.html" dashboard/index.html
          declare -A section=([allocator]=placement [router]=routing)
          for check in allocator router; do
            dir="component-checks/$check"
            if [[ -f "results/$check/meta.json" ]]; then
              python3 "$RUNNER_TEMP/publish.py" perf --target "$check" --results "results/$check" \
                --run-id "$GITHUB_RUN_ID" --run-url "$RUN_URL" --out "$dir" \
                --date "$RUN_STARTED_AT"
            fi
            if [[ -d "$dir/runs" && -s "$RUNNER_TEMP/runs.jsonl" ]]; then
              python3 "$RUNNER_TEMP/publish.py" backfill --out "$dir" \
                --runs "$RUNNER_TEMP/runs.jsonl"
            fi
            if [[ -d "$dir" ]]; then
              python3 "$RUNNER_TEMP/publish.py" redirect --out "$dir" \
                --to "../../dashboard/#view=${section[$check]}"
            fi
          done
          git add -A component-checks dashboard
          git diff --cached --quiet || git -c user.name=model-based-tests \
            -c user.email=github@users.noreply.github.com \
            commit -q -m "Publish model-based tests for ${GITHUB_SHA:0:10}"
          git checkout -q -

      - name: Push
        run: git push origin gh-pages:gh-pages
