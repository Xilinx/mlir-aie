# Mutation testing of the router and of the model that checks it. Designs are
# changed in ways with a known answer (the router must route it, must reject
# it, or must route it the same), and routed output is corrupted to measure how
# often the model's verifier notices.

name: Router mutation tests

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Routable designs per device and hop setting (router_mutation.py --seeds)'
        default: '400'
      first_seed:
        description: 'First seed (router_mutation.py --first-seed)'
        default: '0'
  schedule:
    - cron: '47 3 * * *'

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive
  SEEDS: ${{ inputs.seeds || '400' }}
  FIRST_SEED: ${{ inputs.first_seed || '0' }}

concurrency:
  group: router-mutation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  router-mutation-tests:
    name: Router mutation tests

    runs-on: ubuntu-24.04

    steps:
      - name: Get the project repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
          submodules: "true"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python utils/mlir_aie_wheels/vendor_eudsl.py \
              --requirements python/requirements.txt \
              --install-non-eudsl
          python -m pip install --require-hashes -r python/requirements_dev.lock

      - name: Setup Cpp
        uses: aminya/setup-cpp@15a6bd8cf39030f88b5da3d203a829ec4eea4955  # v1.10.1
        with:
          compiler: llvm
          cmake: true
          ninja: true
          cppcheck: false
          clangtidy: false
          clangformat: false

      # Shares the cache of the matching buildAndTestMulti.yml configuration.
      - uses: ./.github/actions/setup_ccache
        id: setup_ccache
        with:
          MATRIX_OS: ubuntu-24.04
          MATRIX_ARCH: x86
          EXTRA_KEY: compile-and-test-llvm-assert=ON-rtti=ON

      - name: Get MLIR
        run: |
          VERSION=$(utils/clone-llvm.sh --get-wheel-version)
          for attempt in 1 2 3; do
            rm -f mlir-*.whl
            if pip -q download mlir==$VERSION \
              -f https://github.com/Xilinx/mlir-aie/releases/expanded_assets/mlir-distro; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to download MLIR wheel after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          unzip -q mlir-*.whl

      - name: Build
        id: build
        run: |
          mkdir -p build_release
          cd build_release
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PLATFORM_NO_VERSIONED_SONAME=ON \
            -DCMAKE_VISIBILITY_INLINES_HIDDEN=ON \
            -DCMAKE_C_VISIBILITY_PRESET=hidden \
            -DCMAKE_CXX_VISIBILITY_PRESET=hidden \
            -DAIE_COMPILER=NONE \
            -DAIE_LINKER=NONE \
            -DAIE_ENABLE_PYTHON_PASSES=OFF \
            -DHOST_COMPILER=NONE \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_ENABLE_RTTI=ON \
            -DCMAKE_MODULE_PATH=$PWD/../cmake/modulesXilinx \
            -DMLIR_DIR=$PWD/../mlir/lib/cmake/mlir \
            -DLLVM_DIR=$PWD/../mlir/lib/cmake/llvm \
            -DLLVM_EXTERNAL_LIT="$(which lit)"
          ninja
          echo "$PWD/bin" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$PWD/python" >> "$GITHUB_ENV"

      # Each run exits nonzero on a failed mutator or relation, or a corruption
      # the verifier misses. Failing designs are saved under failures/, with
      # shrunk repros of failed mutators under failures/*/repros.
      - name: Router, npu1, hops on
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python utils/router_mutation.py --device npu1 \
            --seeds "$SEEDS" --first-seed "$FIRST_SEED" --jobs "$(nproc)" \
            --out failures/npu1-hops-on --shrink --repros failures/npu1-hops-on/repros

      - name: Router, npu1, hops off
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python utils/router_mutation.py --device npu1 --hops-off \
            --seeds "$SEEDS" --first-seed "$FIRST_SEED" --jobs "$(nproc)" \
            --out failures/npu1-hops-off --shrink --repros failures/npu1-hops-off/repros

      - name: Router, npu2, hops on
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python utils/router_mutation.py --device npu2 \
            --seeds "$SEEDS" --first-seed "$FIRST_SEED" --jobs "$(nproc)" \
            --out failures/npu2-hops-on --shrink --repros failures/npu2-hops-on/repros

      - name: Router, npu2, hops off
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python utils/router_mutation.py --device npu2 --hops-off \
            --seeds "$SEEDS" --first-seed "$FIRST_SEED" --jobs "$(nproc)" \
            --out failures/npu2-hops-off --shrink --repros failures/npu2-hops-off/repros

      - name: Upload failing designs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: router-mutation-test-failures
          path: failures/
          if-no-files-found: ignore
