name: Build and Test with AIE tools on Ryzen AI (Windows)

permissions:
  contents: read

on:
  # No `push` on main: the merge queue already tests the exact commit that
  # merging pushes there, so a postsubmit run re-tests an identical SHA. main is
  # admin-enforced with a required merge queue and no force pushes, so nothing
  # can reach it without a merge_group run having tested it first. The nightly
  # schedule below still covers main for environment drift.
  #
  # test-ryzen-ai is kept: it is a manual push target that does not go through
  # the queue, so it has no merge_group run to inherit.
  push:
    branches:
      - test-ryzen-ai
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  schedule:
    # Runs at midnight (00:00) every day
    - cron: '0 0 * * *'

concurrency:
  # A PR number if a pull request and otherwise the commit hash. This cancels
  # queued and in-progress runs for the same PR (presubmit) or commit
  # (postsubmit).
  group: ci-build-test-ryzenai-windows-${{ github.event.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Peano only: Vitis/xchesscc is not part of the supported native-Windows
  # toolchain (see docs/buildHostWinNative.md); AIE_BUILD_CHESS_CLANG is
  # force-disabled on WIN32 in the top-level CMakeLists.txt regardless.
  LIT_OPTS: -sv --time-tests --timeout 600 --show-unsupported --show-excluded

jobs:

  build-and-test-from-source:
    name: Run Tests and Examples on Ryzen AI (Built from Source, Windows)
    # Mirrors buildAndTestRyzenAI.yml's Linux job: build mlir-aie from source
    # against a published MLIR wheel and run the lit suite on real NPU
    # hardware. Windows has no Makefile (`make`) on PATH by default, so
    # Makefile-based programming_examples/programming_guide tests are
    # automatically skipped by lit (see the "makefile_examples" feature gate
    # in python/aie_lit_utils/lit_config_helpers.py); JIT-style Python
    # examples (@iron.jit) still run and cover the NPU end to end.
    runs-on: [self-hosted, windows, devlab-dispatch, strix-halo]
    # Normal exec is 19-21 min; observed hang on this job 71.4 min (2026-08-04).
    # Bumped from 90: slproweb.com was observed serving the OpenSSL installer
    # at a throttled ~50KB/s, so the one-time cache-seeding download (see the
    # "Cache Windows OpenSSL" step) can take ~85min on its own; every run
    # after that seeds from the GH Actions cache in seconds and finishes in
    # the normal 19-21min.
    timeout-minutes: 180
    env:
      NPU_CACHE_HOME: ${{ github.workspace }}\iron-cache-${{ github.run_id }}
      PIP_CACHE_DIR: ${{ github.workspace }}\.pip-cache-${{ github.run_id }}
      # Force matplotlib's non-interactive backend: taplib visualize() calls
      # plt.show(), which blocks forever on this headless runner (Linux CI has
      # no DISPLAY, so it already falls back to Agg).
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: "true"

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1

      - name: Verify Python
        # actions/setup-python isn't used here: its installer invokes a
        # setup.ps1 under Windows PowerShell, which is blocked by this
        # runner's default script execution policy. Python 3.13 is already
        # provisioned on the runner as a host prerequisite (see
        # Windows_runner_setup_mlir-aie.md), matching how the Linux
        # self-hosted job also relies on a pre-provisioned interpreter
        # instead of actions/setup-python.
        shell: cmd
        run: |
          python --version
          if errorlevel 1 exit /b 1

      - name: Ensure Windows XRT SDK
        # Persistent devlab runners are hand-provisioned with the XRT SDK per
        # docs/buildHostWinNative.md Section 3, but the devlab-dispatch pool
        # recreates its runners per job, so that one-time host setup doesn't
        # stick. Self-heal here instead of failing outright: fetch the same
        # SDK archive the guide points to and extract it to the canonical
        # C:\Xilinx\XRT path if XRT isn't already present on this runner.
        shell: cmd
        run: |
          if defined XRT_ROOT if exist "%XRT_ROOT%" goto :xrt_ready
          if exist "C:\Xilinx\XRT" goto :xrt_default

          echo XRT SDK not found on this runner - downloading it
          if exist "xrt_sdk_download" rmdir /s /q "xrt_sdk_download"
          mkdir xrt_sdk_download
          curl.exe --fail --location --connect-timeout 15 --max-time 300 --retry 3 --retry-all-errors --retry-delay 5 -o "xrt_sdk_download\xrt_windows_sdk.zip" "https://github.com/Xilinx/XRT/releases/download/2.21.75/xrt_windows_sdk.zip"
          if errorlevel 1 exit /b 1

          python -c "import zipfile; zipfile.ZipFile(r'xrt_sdk_download\xrt_windows_sdk.zip').extractall(r'xrt_sdk_download')"
          if errorlevel 1 exit /b 1

          if not exist "xrt_sdk_download\xrt_sdk\xrt" (
            echo ##[error]xrt_sdk\xrt not found after extracting xrt_windows_sdk.zip - check the archive layout
            exit /b 1
          )

          if not exist "C:\Xilinx" mkdir "C:\Xilinx"
          move /y "xrt_sdk_download\xrt_sdk\xrt" "C:\Xilinx\XRT"
          if errorlevel 1 exit /b 1
          rmdir /s /q "xrt_sdk_download"

          :xrt_default
          echo XRT_ROOT=C:\Xilinx\XRT>>"%GITHUB_ENV%"
          exit /b 0

          :xrt_ready
          echo Using existing XRT_ROOT=%XRT_ROOT%

      - name: Cache Windows OpenSSL
        # slproweb.com (the official source for this installer) was observed
        # serving it at a throttled ~50KB/s from this runner pool's network
        # path - a 251MB file at that rate takes ~85min, which no per-attempt
        # curl timeout can paper over. Cache the verified, installed output
        # directory in GitHub's cache backend (keyed on the pinned version +
        # sha256, so a version bump below naturally invalidates it) so only
        # the first run - or a run after a 7-day-unused cache eviction - pays
        # for the slow download; every other ephemeral runner just restores
        # from cache in seconds.
        uses: actions/cache@v4
        with:
          path: C:\OpenSSL-Win64
          key: openssl-win64-4_0_3-0f5436092d1303db9052d3c114fbc6326abe0276861619e26da5156ddf7ca087

      - name: Ensure Windows OpenSSL
        # Persistent devlab runners have the full (non-Light) Win64 OpenSSL
        # package installed by hand per docs/buildHostWinNative.md Addendum
        # B.1, but the devlab-dispatch pool recreates its runners per job.
        # Self-heal here the same way as the XRT SDK step above: fetch the
        # pinned installer from its official source, verify its hash (silent
        # installers skip the interactive prompt that would normally catch a
        # bad download), and run it unattended. Installed to C:\OpenSSL-Win64
        # (not the doc's default C:\Program Files\OpenSSL-Win64): the build
        # step below forwards OPENSSL_ROOT_DIR to a bash script that splits
        # EXTRA_CMAKE_ARGS unquoted, so a space in the path silently truncates
        # the flag - this was observed breaking FindOpenSSL on a runner where
        # 8.3 short-name generation (the previous space-avoidance workaround)
        # turned out to be disabled. The ~251MB installer is fetched with curl
        # (bundled in modern Windows) rather than plain
        # urllib.request.urlretrieve, which has no timeout and was observed
        # hanging far past its historical ~3min duration on two separate
        # ephemeral runners; curl bounds each attempt and retries instead of
        # stalling for the whole job. Cache restores (see the "Cache Windows
        # OpenSSL" step above) avoid this download most of the time; on a
        # cache miss, -C - resumes across curl's own retries instead of
        # restarting from byte 0, since at the observed ~50KB/s the 251MB file
        # takes ~85min and no single --max-time window can hope to complete it
        # in one pass.
        # Check for the static libcrypto lib CMake's FindOpenSSL actually
        # needs (via OPENSSL_USE_STATIC_LIBS in the build step below), not
        # just the top-level directory: a devlab-dispatch runner was seen
        # with a pre-existing OpenSSL-Win64 install that had headers but no
        # static libs, which satisfied the old directory check yet broke the
        # cmake configure two steps later.
        shell: cmd
        run: |
          if exist "C:\OpenSSL-Win64\lib\VC\x64\MT\libcrypto_static.lib" goto :openssl_ready

          echo OpenSSL not found on this runner - downloading it
          set "OPENSSL_EXE=Win64OpenSSL-4_0_3.exe"
          set "OPENSSL_SHA256=0f5436092d1303db9052d3c114fbc6326abe0276861619e26da5156ddf7ca087"
          if exist "%OPENSSL_EXE%" del /f /q "%OPENSSL_EXE%"
          curl.exe --fail --location --connect-timeout 15 --max-time 1500 --retry 8 --retry-all-errors --retry-delay 10 -C - -o "%OPENSSL_EXE%" "https://slproweb.com/download/%OPENSSL_EXE%"
          if errorlevel 1 exit /b 1

          python -c "import hashlib,sys; h = hashlib.sha256(open(r'%OPENSSL_EXE%', 'rb').read()).hexdigest(); sys.exit(0 if h == '%OPENSSL_SHA256%' else 1)"
          if errorlevel 1 (
            echo ##[error]%OPENSSL_EXE% sha256 mismatch - refusing to run an unverified installer
            exit /b 1
          )

          "%OPENSSL_EXE%" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="C:\OpenSSL-Win64"
          if errorlevel 1 exit /b 1
          del /f /q "%OPENSSL_EXE%"

          if not exist "C:\OpenSSL-Win64\lib\VC\x64\MT\libcrypto_static.lib" (
            echo ##[error]C:\OpenSSL-Win64\lib\VC\x64\MT\libcrypto_static.lib still missing after running %OPENSSL_EXE% - installer may require elevation on this runner, or may not be the full non-Light package
            exit /b 1
          )

          :openssl_ready
          echo OpenSSL static libs ready at C:\OpenSSL-Win64

      - name: Ensure Windows LLVM/clang toolchain
        # Host-side lit tests (e.g. test/Runtime/TxnEncoding/*_host.test) compile
        # small x86_64 host executables via %host_clang, which the lit config
        # resolves to a real clang++ if one can be found. Persistent devlab
        # runners get one from the "C++ Clang Compiler for Windows" Visual
        # Studio component documented in docs/buildHostWinNative.md Section
        # 1.1, but the devlab-dispatch pool's golden image does not include
        # it, so the lookup falls through to a bare "clang++" that resolves
        # at test-run time to Peano's bare-metal AIE cross-compiler instead --
        # it is missing host headers like mm_malloc.h and fails every host
        # test. Self-heal with the standalone LLVM package instead of
        # modifying the existing VS install: same winget-based approach the
        # doc already uses for other tools, independent of VS versioning.
        #
        # The mlir-aie build itself is driven with clang-cl (set via
        # CMAKE_C_COMPILER/CMAKE_CXX_COMPILER below), not clang++: CMake's
        # WINDOWS_EXPORT_ALL_SYMBOLS target property - which upstream MLIR's
        # Python bindings rely on to export every public symbol of the
        # monolithic MLIRPythonCAPI/MLIRPythonSupport DSOs - only takes
        # effect for MSVC-like toolchains (CMake's MSVC variable is only ever
        # TRUE for clang-cl or real cl.exe, never for clang++'s GNU driver,
        # even when it targets windows-msvc). Under clang++ it silently
        # no-ops, leaving every Python extension module's import of
        # PyMlirContext/PyOperation/etc. unresolved at link time.
        shell: cmd
        run: |
          if exist "C:\Program Files\LLVM\bin\clang++.exe" if exist "C:\Program Files\LLVM\bin\clang-cl.exe" goto :llvm_ready

          echo LLVM/clang not found on this runner - installing it
          winget install -e --id LLVM.LLVM --silent --accept-package-agreements --accept-source-agreements
          if errorlevel 1 exit /b 1

          if not exist "C:\Program Files\LLVM\bin\clang-cl.exe" (
            echo ##[error]C:\Program Files\LLVM\bin\clang-cl.exe still missing after installing LLVM.LLVM via winget
            exit /b 1
          )

          :llvm_ready
          echo C:\Program Files\LLVM\bin>>"%GITHUB_PATH%"

      - name: Setup IRON environment
        shell: cmd
        run: |
          REM Avoid git "dubious ownership" rejection when --dev's pre-commit
          REM hook install shells out to git in the runner-owned work tree.
          git config --global --add safe.directory "%CD%"
          if errorlevel 1 exit /b 1

          python utils\iron_setup.py --dev
          if errorlevel 1 exit /b 1

      - name: Download MLIR wheel and build mlir-aie
        shell: cmd
        run: |
          call .\iron_env.cmd
          if errorlevel 1 exit /b 1

          REM utils\clone-llvm.sh is a bash script; Git for Windows ships its
          REM own bash.exe (installed as part of "Git for Windows" in the
          REM runner setup guide) that can run it directly. Its bin directory
          REM isn't on PATH by default (only Git\cmd, for git.exe itself is),
          REM so call it by its default winget install path.
          if not exist "C:\Program Files\Git\bin\bash.exe" (
            echo ##[error]C:\Program Files\Git\bin\bash.exe not found - install Git for Windows per the runner setup guide
            exit /b 1
          )
          for /f "usebackq delims=" %%v in (`"C:\Program Files\Git\bin\bash.exe" utils/clone-llvm.sh --get-wheel-version`) do set MLIR_VERSION=%%v
          if not defined MLIR_VERSION exit /b 1

          mkdir my_install
          pushd my_install
          python -m pip -q download mlir==%MLIR_VERSION% -f https://github.com/Xilinx/mlir-aie/releases/expanded_assets/mlir-distro
          if errorlevel 1 exit /b 1
          dir mlir-*.whl
          python -c "import zipfile,glob; zipfile.ZipFile(glob.glob('mlir-*.whl')[0]).extractall('.')"
          if errorlevel 1 exit /b 1

          REM llvm-debuginfod.exe has gone missing post-extraction here (likely
          REM AV quarantine); fail early with a clear message, not a later
          REM confusing CMake error.
          if not exist "mlir\bin\llvm-debuginfod.exe" (
            echo ##[error]mlir\bin\llvm-debuginfod.exe is missing after wheel extraction - check endpoint security/antivirus quarantine logs on the runner
            dir mlir\bin\llvm-debuginfod* 2>nul
            exit /b 1
          )

          REM LLVMExports.cmake bakes in a diaguids.lib (DIA SDK) path from the
          REM VS edition that built the wheel; rewrite it for this runner.
          python -c "import sys; sys.path.insert(0, r'..\utils\mlir_aie_wheels\scripts'); from pathlib import Path; import download_mlir; download_mlir._fixup_llvm_diaguids(Path('mlir'))"
          if errorlevel 1 exit /b 1

          REM Future-dated wheel timestamps make ninja loop; stamp them to the past.
          python -c "import os,time; [os.utime(os.path.join(r,f),(315600000,315600000)) for r,_,fs in os.walk('mlir') for f in fs]"
          if errorlevel 1 exit /b 1
          popd

          if not defined PEANO_INSTALL_DIR (
            echo ##[error]PEANO_INSTALL_DIR is not set - ensure the runner is provisioned per the runner setup guide
            exit /b 1
          )
          if not exist "%PEANO_INSTALL_DIR%" (
            echo ##[error]PEANO_INSTALL_DIR="%PEANO_INSTALL_DIR%" does not exist - check runner provisioning
            exit /b 1
          )
          if not defined XRT_ROOT (
            echo ##[error]XRT_ROOT is not set - ensure XRT is installed and XRT_ROOT is set per the runner setup guide
            exit /b 1
          )
          if not exist "%XRT_ROOT%" (
            echo ##[error]XRT_ROOT="%XRT_ROOT%" does not exist - check XRT installation on the runner
            exit /b 1
          )

          REM tools/bootgen unconditionally requires OpenSSL (used by aiecc
          REM for in-process PDI generation). Per docs/buildHostWinNative.md
          REM Addendum B.1, this must be the full Win64 OpenSSL package from
          REM Shining Light Productions (NOT the "Light" variant, which lacks
          REM dev headers); the "Ensure Windows OpenSSL" step above installs
          REM it to C:\OpenSSL-Win64 (space-free, see that step's comment).
          if not exist "C:\OpenSSL-Win64" (
            echo ##[error]C:\OpenSSL-Win64 not found - install the full Win64 OpenSSL package per docs/buildHostWinNative.md Addendum B.1
            exit /b 1
          )

          for /f "usebackq delims=" %%p in (`python -c "import sys; print(sys.executable)"`) do set PYTHON_EXE=%%p

          REM Build with the same script as the Linux job (one source of truth).
          REM Wheel is already prepped above, so pass it as arg 1 to skip the
          REM script's own download. EXTRA_CMAKE_ARGS carries the Windows-only
          REM -D flags; paths are forward-slashed and must be space-free since
          REM the script expands args unquoted (read -ra on a plain string).
          REM FindOpenSSL.cmake only searches the MT/MTd (static-CRT) lib
          REM paths/names when OPENSSL_MSVC_STATIC_RT is set - otherwise it
          REM defaults to MD mode and won't find the MT-only static libs this
          REM installer lays down, even with OPENSSL_USE_STATIC_LIBS=TRUE.
          REM CMAKE_C_COMPILER/CMAKE_CXX_COMPILER select clang-cl (bare name,
          REM resolved via the PATH entry the LLVM toolchain step above adds)
          REM instead of CMake's default of whatever "clang"/"clang++" it
          REM finds first - see the comment on that step for why clang-cl is
          REM required here, not just clang++ in its GNU-driver mode.
          set "XRT_ROOT_FWD=%XRT_ROOT:\=/%"
          set "PYTHON_EXE_FWD=%PYTHON_EXE:\=/%"
          set "PEANO_INSTALL_DIR_FWD=%PEANO_INSTALL_DIR:\=/%"
          set "OPENSSL_ROOT_FWD=C:/OpenSSL-Win64"
          set "EXTRA_CMAKE_ARGS=-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DAIE_ENABLE_PYTHON_PASSES=OFF -DAIE_ENABLE_XRT_PYTHON_BINDINGS=ON -DXRT_ROOT=%XRT_ROOT_FWD% -DPython3_EXECUTABLE=%PYTHON_EXE_FWD% -DOPENSSL_ROOT_DIR=%OPENSSL_ROOT_FWD% -DOPENSSL_USE_STATIC_LIBS=TRUE -DOPENSSL_MSVC_STATIC_RT=TRUE"

          REM arg 4 = provisioned Peano, else the script derives its own.
          "C:\Program Files\Git\bin\bash.exe" utils/build-mlir-aie-from-wheels.sh my_install/mlir build install "%PEANO_INSTALL_DIR_FWD%"
          if errorlevel 1 exit /b 1

      - name: Run tests and examples
        shell: cmd
        run: |
          call .\iron_env.cmd
          if errorlevel 1 exit /b 1

          if exist "%NPU_CACHE_HOME%" rmdir /s /q "%NPU_CACHE_HOME%"
          mkdir "%NPU_CACHE_HOME%"
          set XRT_CONTEXT_CACHE_SIZE=2

          pushd build

          REM Run every suite even if an earlier one fails, then fail the step if
          REM any did. Fail-fast here meant a red check-aie -- which main has been
          REM carrying -- aborted the step before check-reference-designs ran, so
          REM the example and guide suites produced no Windows signal at all and
          REM a PR touching only examples could not be evaluated. Nothing is
          REM masked: FAILED collects the targets and the step still exits 1.
          set FAILED=

          echo ===== Running tests =====
          ninja check-aie
          if errorlevel 1 set FAILED=%FAILED% check-aie

          echo ===== Running concurrency tests =====
          ninja check-aie-concurrency
          if errorlevel 1 set FAILED=%FAILED% check-aie-concurrency

          echo ===== Running examples =====
          ninja check-reference-designs
          if errorlevel 1 set FAILED=%FAILED% check-reference-designs
          ninja check-programming-guide
          if errorlevel 1 set FAILED=%FAILED% check-programming-guide

          popd

          if not "%FAILED%"=="" (
            echo ##[error]Failing targets:%FAILED%
            exit /b 1
          )
          echo ===== All suites passed =====

      - name: Cleanup workspace
        if: always()
        shell: cmd
        run: |
          if exist "%NPU_CACHE_HOME%" rmdir /s /q "%NPU_CACHE_HOME%"
          if exist "%PIP_CACHE_DIR%" rmdir /s /q "%PIP_CACHE_DIR%"
          REM Fixed-name build trees the next checkout's git-clean can miss on
          REM Windows (locked files / long paths); remove them here so a partial
          REM clean can't leave a poisoned tree on this persistent runner.
          if exist "build" rmdir /s /q "build"
          if exist "install" rmdir /s /q "install"
          if exist "my_install" rmdir /s /q "my_install"
          if exist "xrt_sdk_download" rmdir /s /q "xrt_sdk_download"
          if exist "Win64OpenSSL-4_0_3.exe" del /f /q "Win64OpenSSL-4_0_3.exe"
