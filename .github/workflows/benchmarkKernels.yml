name: Kernel Benchmarks on Ryzen AI

# Record cycles / wall time / compile size for aie_kernels via the IRON JIT
# path and publish graphs to the site. Never gates PRs. On Peano/LLVM-bump
# PRs: compare against the recorded baseline; the action comments only if a
# hard-threshold series regressed. Everything else: no comments, no data,
# just a red run and an artifact.
#
# Runs nightly from main (which records the baseline), on pull requests
# that bump the Peano pin, and on demand. A dispatched run on main publishes
# like the nightly does; a dispatched run on any other branch, or a pull
# request, only compares and uploads its records.

permissions:
  contents: read
  pull-requests: write   # sticky comment (peano PRs only)

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'regex on kernel names (e.g. linalg/)'
        required: false
        default: ''
  schedule:
    - cron: '0 6 * * *'          # after the 00:00 test nightly
  pull_request:
    paths:
      - utils/peano-requirements.txt

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive
  BENCH_PMODE: performance

jobs:
  bench:
    name: Kernel bench (${{ matrix.runner_type }})
    # Only in-repo branches on self-hosted hardware.
    if: github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
    # All three labels must be present on a runner for it to be picked, and
    # any runner carrying them can be: this does not pin a machine, so nightly
    # runs move between hosts of the same generation. `bench` selects the pool
    # reserved for timing, and the concurrency group below is what stops two
    # benchmark jobs sharing one NPU.
    runs-on: [self-hosted, bench, "${{ matrix.runner_type }}"]
    timeout-minutes: 120
    # Never share an NPU; preserve queued runs (up to GitHub's 100-run limit).
    concurrency:
      group: kernel-bench-${{ matrix.runner_type }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_type: aie2-4col
            expected_npu: npu1
          - runner_type: aie2p-8col
            expected_npu: npu2
    env:
      AIE_EXPECTED_NPU: ${{ matrix.expected_npu }}
      NPU_CACHE_HOME: ${{ github.workspace }}/bench-cache-${{ github.run_id }}
      PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache-bench-${{ github.run_id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"

      - name: Setup virtual environment / prerequisites
        run: source ./utils/env_install.sh aie-venv --dev --extras

      - name: Build from source
        run: |
          sudo prlimit -lunlimited --pid $$
          [ -f /opt/xilinx/xrt/setup.sh ] && source /opt/xilinx/xrt/setup.sh
          source aie-venv/bin/activate
          export EXTRA_CMAKE_ARGS="-DPython3_EXECUTABLE=$(which python) \
            -DXRT_ROOT=/opt/xilinx/xrt -DAIE_ENABLE_PYTHON_PASSES=OFF \
            -DAIE_ENABLE_XRT_PYTHON_BINDINGS=ON"
          ./utils/build-mlir-aie-from-wheels.sh "" build mlir_aie

      - name: NPU preflight and performance mode
        id: preflight
        run: |
          sudo prlimit -lunlimited --pid $$
          [ -f /opt/xilinx/xrt/setup.sh ] && source /opt/xilinx/xrt/setup.sh
          XRT_SMI=$(command -v xrt-smi || command -v xrt-smi.exe)
          [ -n "$XRT_SMI" ]
          EXAMINE=$("$XRT_SMI" examine)
          printf '%s\n' "$EXAMINE"
          BDF=$(printf '%s\n' "$EXAMINE" | grep -oE '\[[0-9a-f:.]+\]' | head -1 | tr -d '[]')
          [ -n "$BDF" ]
          echo "bdf=$BDF" >> "$GITHUB_OUTPUT"
          # `performance` = max DPM, clock gating on. `turbo` is refused
          # while any hwctx is open, so it is not used on shared hosts.
          # Setting the mode needs root (amdxdna refuses the ioctl otherwise).
          # Run the exact command in the condition so a denied sudo rule is
          # non-fatal even when permissions are restricted by argument.
          if sudo -n "$XRT_SMI" configure -d "$BDF" --pmode "$BENCH_PMODE"; then
            :
          else
            echo "::warning::Cannot set --pmode $BENCH_PMODE: this runner needs passwordless sudo for $XRT_SMI"
          fi
          "$XRT_SMI" examine -d "$BDF" --report platform

      - name: Run kernel correctness suite
        id: correctness
        run: |
          sudo prlimit -lunlimited --pid $$
          [ -f /opt/xilinx/xrt/setup.sh ] && source /opt/xilinx/xrt/setup.sh
          source aie-venv/bin/activate
          source utils/env_setup.sh mlir_aie
          export XRT_CONTEXT_CACHE_SIZE=2
          rm -rf "$NPU_CACHE_HOME" && mkdir -p "$NPU_CACHE_HOME"
          # Every case in test/python/npu/kernel_cases.py, under every edge-data
          # case its contract admits, for three random seeds.
          python -m pytest test/python/npu/test_kernels_e2e.py -m extensive -v \
            --junitxml=correctness.xml --seeds 3 2>&1 | tee correctness.log

      - name: Run kernel benchmarks
        id: bench
        # Correctness must be green before numbers are trusted.
        if: steps.correctness.outcome == 'success'
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          sudo prlimit -lunlimited --pid $$
          [ -f /opt/xilinx/xrt/setup.sh ] && source /opt/xilinx/xrt/setup.sh
          source aie-venv/bin/activate
          source utils/env_setup.sh mlir_aie
          export XRT_CONTEXT_CACHE_SIZE=2
          python -m pytest test/python/npu/test_kernels_bench.py -m benchmark -v \
            --bench-out bench.json --bench-meta meta.json --pmode "$BENCH_PMODE" \
            --warmup 10 --iters 50 \
            ${ONLY:+-k "$ONLY"} 2>&1 | tee bench.log
          # A failing session leaves no bench.json -> downstream steps skip.
          # meta.json is written either way, and records why.

      - name: Read power mode
        id: pmode
        if: hashFiles('bench.json') != ''
        run: |
          python3 -c 'import json, sys; print(sys.argv[1] + "=" + (json.load(open(sys.argv[2]))["preflight"]["pmode"] or sys.exit("power mode is unreadable")))' \
            pmode meta.json >> "$GITHUB_OUTPUT"

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: kernel-bench-${{ matrix.expected_npu }}-${{ github.run_id }}
          path: |
            bench.json
            meta.json
            bench.log
            correctness.log
            correctness.xml
          if-no-files-found: ignore

      # ---------------- peano bump PR: compare, one sticky comment --------
      - name: Restore baseline (PR)
        if: github.event_name == 'pull_request' && hashFiles('bench.json') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: baseline
          key: kernel-bench-baseline-${{ matrix.expected_npu }}-
          restore-keys: kernel-bench-baseline-${{ matrix.expected_npu }}-

      - name: Compare against baseline (PR)
        # Needs a nightly baseline in the cache; the first runs have none.
        if: github.event_name == 'pull_request' && hashFiles('bench.json') != '' && hashFiles('baseline/benchmark-data.json') != ''
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba  # v1.22.1
        with:
          name: aie_kernels (${{ matrix.expected_npu }}, ${{ steps.pmode.outputs.pmode }})
          tool: customSmallerIsBetter
          output-file-path: bench.json
          external-data-json-path: baseline/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: '103%'
          comment-on-alert: true     # one comment, only if something regressed
          summary-always: true
          fail-on-alert: false
          save-data-file: false

      - name: Cleanup
        if: always()
        run: |
          rm -rf "$NPU_CACHE_HOME" "$PIP_CACHE_DIR"

  publish:
    needs: bench
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/publishKernelResults.yml
    with:
      static: false
