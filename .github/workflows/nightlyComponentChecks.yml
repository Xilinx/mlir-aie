name: Nightly Component Checks

# Nightly checks of compiler components and whole example designs (kernels
# alone are nightlyKernelChecks.yml). Never gates PRs.
#   seed-sweep (CPU): every SA placer seed on a small fixture and mobilenet --
#     does it place, and at what CPU time, memory and placement cost.
#   hw-checks (npu2): mobilenet at three seeds, two SA efforts and batches
#     1 to 64; llama 3.2 1b's 16-layer decode; yolo26n's 640x640 detector.
#     Each is built, verified against its numpy oracle and timed.
# Runs nightly from main, and on PRs that touch the placer or these checks
# (the sweep only). The nightly and an unfiltered dispatch on main publish to
# component-checks/<check>/ for the maintainer dashboard. A publishing run
# times only in $PERF_PMODE; a failed check still publishes what it measured.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: 'seeds to sweep in the CPU-only check (default 20); any other count never publishes'
        required: false
        default: ''
  schedule:
    - cron: '30 6 * * *'          # after the kernel checks' 6:00 run
  pull_request:
    paths:
      - include/aie/Dialect/AIE/Transforms/AIEPlacer.h
      - lib/Dialect/AIE/Transforms/AIEPlaceTiles.cpp
      - lib/Dialect/AIE/Transforms/AIEPlacer.cpp
      - lib/Dialect/AIE/Transforms/AIESAPlacer.cpp
      - test/place-tiles/sa_placer/**
      - utils/component_checks/**
      - .github/workflows/nightlyComponentChecks.yml

# A new push to a PR cancels that PR's older run.
concurrency:
  group: component-checks-run-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive
  PERF_PMODE: turbo

jobs:
  seed-sweep:
    name: SA placer seed sweep (CPU-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache-component-checks-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"

      - name: Setup virtual environment / prerequisites
        run: source ./utils/env_install.sh aie-venv --dev --extras

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d  # v1.2.24
        with:
          key: component-checks-sweep
          max-size: 1G

      - name: Build from source
        run: |
          ccache --set-config=compiler_check=content
          ccache --set-config=sloppiness=locale,time_macros
          source aie-venv/bin/activate
          export EXTRA_CMAKE_ARGS="-DPython3_EXECUTABLE=$(which python) \
            -DAIE_ENABLE_PYTHON_PASSES=OFF -DAIE_ENABLE_XRT_PYTHON_BINDINGS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          ./utils/build-mlir-aie-from-wheels.sh "" build mlir_aie

      # The count comes in through the environment, and sa_placer.py refuses
      # anything but a positive integer.
      - name: Run the seed sweep
        env:
          SEEDS: ${{ inputs.seeds }}
        run: |
          source aie-venv/bin/activate
          python utils/component_checks/sa_placer.py \
            --aie-opt build/bin/aie-opt --seeds "${SEEDS:-20}" \
            --out perf.json --meta meta.json | tee sweep.log

      - name: Summarize
        if: ${{ !cancelled() && hashFiles('sweep.log') != '' }}
        run: |
          {
            echo "### SA placer seed sweep"
            echo '```'
            cat sweep.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: component-checks-sa-placer-${{ github.run_id }}
          path: |
            perf.json
            meta.json
            sweep.log
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: rm -rf "$PIP_CACHE_DIR"

  hw-checks:
    name: Design checks on hardware (mobilenet, llama, yolo26n; npu2)
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, bench, aie2p-8col]
    # Every design in one job: one build and one preflight, then each design
    # as its own step with its own timeout, results and artifact, so a failure
    # or hang in one still lets the others run and publish. Shares the kernel
    # checks' own npu2 lock, so the nightlies queue rather than risk landing
    # on the same physical NPU at once.
    timeout-minutes: 240
    concurrency:
      group: kernel-checks-aie2p-8col
      cancel-in-progress: false
      queue: max
    env:
      AIE_EXPECTED_NPU: npu2
      PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache-component-checks-${{ github.run_id }}
      CACHE_ROOT: ${{ github.workspace }}/component-checks-cache-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"

      - name: Setup virtual environment / prerequisites
        run: source ./utils/env_install.sh aie-venv --dev --extras

      - name: Build from source
        run: |
          sudo prlimit -lunlimited --pid $$
          [ -f /opt/xilinx/xrt/setup.sh ] && source /opt/xilinx/xrt/setup.sh
          source aie-venv/bin/activate
          export EXTRA_CMAKE_ARGS="-DPython3_EXECUTABLE=$(which python) \
            -DXRT_ROOT=/opt/xilinx/xrt -DAIE_ENABLE_PYTHON_PASSES=OFF \
            -DAIE_ENABLE_XRT_PYTHON_BINDINGS=ON"
          ./utils/build-mlir-aie-from-wheels.sh "" build mlir_aie

      - name: NPU preflight and power mode
        id: preflight
        run: |
          sudo prlimit -lunlimited --pid $$
          [ -f /opt/xilinx/xrt/setup.sh ] && source /opt/xilinx/xrt/setup.sh
          XRT_SMI=$(command -v xrt-smi || command -v xrt-smi.exe)
          [ -n "$XRT_SMI" ]
          EXAMINE=$("$XRT_SMI" examine)
          printf '%s\n' "$EXAMINE"
          BDF=$(printf '%s\n' "$EXAMINE" | grep -oE '\[[0-9a-f:.]+\]' | head -1 | tr -d '[]')
          [ -n "$BDF" ]
          echo "bdf=$BDF" >> "$GITHUB_OUTPUT"
          # As nightlyKernelChecks.yml: the bench runners set turbo at boot,
          # and only a runner found in another mode tries here.
          PLATFORM=$("$XRT_SMI" examine -d "$BDF" --report platform)
          if ! grep -qiE "mode[[:space:]]*:[[:space:]]*$PERF_PMODE\b" <<<"$PLATFORM"; then
            if sudo -n "$XRT_SMI" configure -d "$BDF" --pmode "$PERF_PMODE"; then
              PLATFORM=$("$XRT_SMI" examine -d "$BDF" --report platform)
            else
              echo "::warning::Device is not in --pmode $PERF_PMODE and cannot be set non-interactively with $XRT_SMI; a publishing run will refuse to time in another mode, any other run records the mode it finds"
            fi
          fi
          printf '%s\n' "$PLATFORM"

      - name: Run mobilenet at each seed, effort and batch
        id: mobilenet
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        timeout-minutes: 90
        env:
          # A run that publishes must find the device in $PERF_PMODE; the
          # check refuses to time in any other, and its record says why.
          REQUIRED_PMODE: ${{ (github.ref == 'refs/heads/main' && !inputs.seeds) && env.PERF_PMODE || 'any' }}
          NPU_CACHE_HOME: ${{ env.CACHE_ROOT }}/mobilenet
        run: |
          sudo prlimit -lunlimited --pid $$
          [ -f /opt/xilinx/xrt/setup.sh ] && source /opt/xilinx/xrt/setup.sh
          source aie-venv/bin/activate
          source utils/env_setup.sh mlir_aie
          export XRT_CONTEXT_CACHE_SIZE=2
          rm -rf "$NPU_CACHE_HOME" && mkdir -p "$NPU_CACHE_HOME" results/sa-placer-hw
          python utils/component_checks/sa_placer_hw.py --pmode "$REQUIRED_PMODE" \
            --out results/sa-placer-hw/perf.json --meta results/sa-placer-hw/meta.json \
            | tee results/sa-placer-hw/hw.log

      - name: Run the llama 3.2 1b persistent decode
        id: llama
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        timeout-minutes: 60
        env:
          REQUIRED_PMODE: ${{ (github.ref == 'refs/heads/main' && !inputs.seeds) && env.PERF_PMODE || 'any' }}
          NPU_CACHE_HOME: ${{ env.CACHE_ROOT }}/llama
        # The checkpoint is where amd/IRON's runners keep it,
        # $IRON_EXAMPLE_WEIGHTS_DIR/llama3.2-1b/ (default /srv).
        run: |
          sudo prlimit -lunlimited --pid $$
          [ -f /opt/xilinx/xrt/setup.sh ] && source /opt/xilinx/xrt/setup.sh
          source aie-venv/bin/activate
          source utils/env_setup.sh mlir_aie
          export XRT_CONTEXT_CACHE_SIZE=2
          # generate.py tokenizes its prompt.
          pip install tiktoken==0.14.0
          rm -rf "$NPU_CACHE_HOME" && mkdir -p "$NPU_CACHE_HOME" results/llama-chain-hw
          python utils/component_checks/llama_chain_hw.py --pmode "$REQUIRED_PMODE" \
            --out results/llama-chain-hw/perf.json --meta results/llama-chain-hw/meta.json \
            | tee results/llama-chain-hw/hw.log

      - name: Run the yolo26n detector
        id: yolo26n
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        timeout-minutes: 60
        env:
          REQUIRED_PMODE: ${{ (github.ref == 'refs/heads/main' && !inputs.seeds) && env.PERF_PMODE || 'any' }}
          NPU_CACHE_HOME: ${{ env.CACHE_ROOT }}/yolo26n
        # The model and COCO128 images are where amd/IRON's runners keep
        # them, $IRON_EXAMPLE_WEIGHTS_DIR/yolo26n/ (default /srv).
        run: |
          sudo prlimit -lunlimited --pid $$
          [ -f /opt/xilinx/xrt/setup.sh ] && source /opt/xilinx/xrt/setup.sh
          source aie-venv/bin/activate
          source utils/env_setup.sh mlir_aie
          export XRT_CONTEXT_CACHE_SIZE=2
          rm -rf "$NPU_CACHE_HOME" && mkdir -p "$NPU_CACHE_HOME" results/yolo26n-hw
          python utils/component_checks/yolo26n_hw.py --pmode "$REQUIRED_PMODE" \
            --out results/yolo26n-hw/perf.json --meta results/yolo26n-hw/meta.json \
            | tee results/yolo26n-hw/hw.log

      # The tables only: a failed run's log follows its row in hw.log.
      - name: Summarize
        if: ${{ !cancelled() && hashFiles('results/*/hw.log') != '' }}
        run: |
          {
            if [[ -f results/sa-placer-hw/hw.log ]]; then
              echo "### MobileNet on hardware"
              echo '```'
              grep -E '^ *seed +batch|^ *[0-9]+ +[0-9]+ +(yes|NO) |^seed [0-9]+: |^aie-opt placed|^batches ' results/sa-placer-hw/hw.log || true
              echo '```'
            fi
            if [[ -f results/llama-chain-hw/hw.log ]]; then
              echo "### Llama 3.2 1B on hardware"
              echo '```'
              grep -E '^ *token [0-9]+|^chain_persist_grow_mh:|^per-token:|^ratio:|^refusing' results/llama-chain-hw/hw.log || true
              echo '```'
            fi
            if [[ -f results/yolo26n-hw/hw.log ]]; then
              echo "### YOLO26n on hardware"
              echo '```'
              grep -E '^image |^yolo26n:|^ort:|^per-image:|^refusing' results/yolo26n-hw/hw.log || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mobilenet results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: component-checks-sa-placer-hw-${{ github.run_id }}
          path: results/sa-placer-hw/
          if-no-files-found: ignore

      - name: Upload llama results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: component-checks-llama-chain-hw-${{ github.run_id }}
          path: results/llama-chain-hw/
          if-no-files-found: ignore

      - name: Upload yolo26n results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: component-checks-yolo26n-hw-${{ github.run_id }}
          path: results/yolo26n-hw/
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: rm -rf "$CACHE_ROOT" "$PIP_CACHE_DIR" results

  publish:
    needs: [seed-sweep, hw-checks]
    # Publish whichever check produced results, even if the other failed.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.seeds }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read  # the workflow's runs, to date each record by its start
    # Same lock publishKernelResults.yml uses, so the nightlies queue instead
    # of racing on the gh-pages branch.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
      queue: max
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: component-checks-sa-placer-${{ github.run_id }}
          path: results/sa-placer
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: component-checks-sa-placer-hw-${{ github.run_id }}
          path: results/sa-placer-hw
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: component-checks-llama-chain-hw-${{ github.run_id }}
          path: results/llama-chain-hw
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: component-checks-yolo26n-hw-${{ github.run_id }}
          path: results/yolo26n-hw

      - name: List the workflow's runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow=${GITHUB_WORKFLOW_REF%@*}
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/${workflow##*/}/runs?per_page=100" \
            --paginate --jq '.workflow_runs[] | {id, event, run_started_at}' \
            > "$RUNNER_TEMP/runs.jsonl" ||
            echo "::warning::could not list the workflow's runs; records are dated when published"
          started=$(jq -r --argjson id "$GITHUB_RUN_ID" 'select(.id == $id) | .run_started_at' \
            "$RUNNER_TEMP/runs.jsonl" 2>/dev/null || true)
          echo "RUN_STARTED_AT=$started" >> "$GITHUB_ENV"

      - name: Fetch publication branch
        run: git fetch origin gh-pages:gh-pages --depth=1

      # As publishKernelResults.yml, one directory per check. The dashboard
      # is published too, so it is there whichever nightly publishes first.
      # The old per-check pages (github-action-benchmark's, removed by
      # migrate), the old index and the kernel checks' old address become
      # redirects to the dashboard's sections.
      - name: Publish results
        run: |
          cp utils/kernel_checks/index.html "$RUNNER_TEMP/index.html"
          cp utils/kernel_checks/publish.py "$RUNNER_TEMP/publish.py"
          git switch -q gh-pages
          mkdir -p dashboard
          cp "$RUNNER_TEMP/index.html" dashboard/index.html
          python3 "$RUNNER_TEMP/publish.py" redirect --out kernel-checks \
            --to "../dashboard/#view=night"
          python3 "$RUNNER_TEMP/publish.py" redirect --out component-checks \
            --to "../dashboard/#view=placement"
          # Each check's old page goes to its section (publish.SECTION_OF).
          declare -A section=([sa-placer]=placement [sa-placer-hw]=performance [llama-chain-hw]=performance [yolo26n-hw]=performance)
          for check in sa-placer sa-placer-hw llama-chain-hw yolo26n-hw; do
            dir="component-checks/$check"
            python3 "$RUNNER_TEMP/publish.py" migrate --out "$dir"
            if [[ -f "results/$check/meta.json" ]]; then
              python3 "$RUNNER_TEMP/publish.py" perf --target "$check" --results "results/$check" \
                --run-id "$GITHUB_RUN_ID" --run-url "$RUN_URL" --out "$dir" \
                --date "$RUN_STARTED_AT"
            fi
            if [[ -d "$dir/runs" && -s "$RUNNER_TEMP/runs.jsonl" ]]; then
              python3 "$RUNNER_TEMP/publish.py" backfill --out "$dir" \
                --runs "$RUNNER_TEMP/runs.jsonl"
            fi
            if [[ -d "$dir" ]]; then
              python3 "$RUNNER_TEMP/publish.py" redirect --out "$dir" \
                --to "../../dashboard/#view=${section[$check]}"
            fi
          done
          git add -A kernel-checks component-checks dashboard
          git diff --cached --quiet || git -c user.name=component-checks \
            -c user.email=github@users.noreply.github.com \
            commit -q -m "Publish component checks for ${GITHUB_SHA:0:10}"
          git checkout -q -

      - name: Push
        run: git push origin gh-pages:gh-pages
