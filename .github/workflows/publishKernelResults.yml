name: Publish kernel results

on:
  workflow_call:
    inputs:
      static:
        description: Publish static checks instead of hardware benchmarks
        required: true
        type: boolean
      branch:
        description: >
          Branch to publish the series to. Overridable so the publish path can
          be rehearsed against a scratch branch; nothing but a rehearsal should
          pass anything other than the default.
        required: false
        default: gh-pages
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Lock the whole batch, not matrix legs, keeping compute parallel.
    # Queue up to 100 publications instead of replacing pending runs. The docs
    # workflow takes this same lock, so it stays a constant both can name.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
      queue: max
    env:
      RESULT_FILE: ${{ inputs.static && 'static.json' || 'bench.json' }}
      BRANCH: ${{ inputs.branch }}
      DATA_DIR_1: ${{ inputs.static && 'bench/static/aie2' || 'bench/npu1' }}
      DATA_DIR_2: ${{ inputs.static && 'bench/static/aie2p' || 'bench/npu2' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.static && 'static-aie2' || 'kernel-bench-npu1' }}-${{ github.run_id }}
          path: results/npu1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.static && 'static-aie2p' || 'kernel-bench-npu2' }}-${{ github.run_id }}
          path: results/npu2

      # Each power mode is its own suite, and so its own section of the page:
      # a chart never mixes modes, and alerts compare like with like.
      - name: Read power modes
        id: pmode
        if: ${{ !inputs.static }}
        run: |
          for npu in npu1 npu2; do
            python3 -c 'import json, sys; print(sys.argv[1] + "=" + (json.load(open(sys.argv[2]))["preflight"]["pmode"] or "unknown"))' \
              "$npu" "results/$npu/meta.json" >> "$GITHUB_OUTPUT"
          done

      - name: Fetch publication branch
        run: git fetch origin "$BRANCH:$BRANCH" --depth=1

      # The action commits to the local publication branch and switches back.
      # Fetch once under the lock, accumulate every series, then push once.
      - name: Record npu1 results
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba  # v1.22.1
        with:
          name: ${{ inputs.static && 'static (aie2)' || format('aie_kernels (npu1, {0})', steps.pmode.outputs.npu1) }}
          tool: customSmallerIsBetter
          output-file-path: results/npu1/${{ env.RESULT_FILE }}
          benchmark-data-dir-path: ${{ env.DATA_DIR_1 }}
          gh-pages-branch: ${{ inputs.branch }}
          skip-fetch-gh-pages: true
          auto-push: false
          alert-threshold: ${{ inputs.static && '101%' || '103%' }}
          comment-on-alert: false
          fail-on-alert: false
          summary-always: true
          max-items-in-chart: 400
      - name: Record npu2 results
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba  # v1.22.1
        with:
          name: ${{ inputs.static && 'static (aie2p)' || format('aie_kernels (npu2, {0})', steps.pmode.outputs.npu2) }}
          tool: customSmallerIsBetter
          output-file-path: results/npu2/${{ env.RESULT_FILE }}
          benchmark-data-dir-path: ${{ env.DATA_DIR_2 }}
          gh-pages-branch: ${{ inputs.branch }}
          skip-fetch-gh-pages: true
          auto-push: false
          alert-threshold: ${{ inputs.static && '101%' || '103%' }}
          comment-on-alert: false
          fail-on-alert: false
          summary-always: true
          max-items-in-chart: 400
      - name: Record npu1 program memory
        if: inputs.static
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba  # v1.22.1
        with:
          name: static pm (aie2)
          tool: customSmallerIsBetter
          output-file-path: results/npu1/static-pm.json
          benchmark-data-dir-path: bench/static-pm/aie2
          gh-pages-branch: ${{ inputs.branch }}
          skip-fetch-gh-pages: true
          auto-push: false
          # Program memory needs more slack than integer II/ZOL/count metrics.
          alert-threshold: '103%'
          comment-on-alert: false
          fail-on-alert: false
          summary-always: true
          max-items-in-chart: 400
      - name: Record npu2 program memory
        if: inputs.static
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba  # v1.22.1
        with:
          name: static pm (aie2p)
          tool: customSmallerIsBetter
          output-file-path: results/npu2/static-pm.json
          benchmark-data-dir-path: bench/static-pm/aie2p
          gh-pages-branch: ${{ inputs.branch }}
          skip-fetch-gh-pages: true
          auto-push: false
          alert-threshold: '103%'
          comment-on-alert: false
          fail-on-alert: false
          summary-always: true
          max-items-in-chart: 400

      - name: Publish all series
        run: git push origin "$BRANCH:$BRANCH"

      - name: Save baselines for PR comparisons
        env:
          STATIC: ${{ inputs.static }}
        shell: bash
        run: |
          # Cache exactly the commit just published, not a later remote update.
          #
          # A series only exists once a run has published it, and `bench/` is
          # created by the first one. Until then `git show` has nothing to
          # read, and under `-o pipefail` that would fail the publish that is
          # busy creating it. Skip instead: the comparison steps are guarded
          # on the baseline file existing, so they sit out the same run.
          save_series() {
            if git cat-file -e "$BRANCH:$1" 2>/dev/null; then
              git show "$BRANCH:$1" \
                | sed -e 's/^window\.BENCHMARK_DATA = //' -e 's/;\s*$//' > "$2"
            else
              echo "no $BRANCH:$1 yet -- nothing to cache as a baseline"
            fi
          }
          for npu in npu1 npu2; do
            if [[ "$npu" == npu1 ]]; then
              data_dir="$DATA_DIR_1"
              target=aie2
            else
              data_dir="$DATA_DIR_2"
              target=aie2p
            fi
            mkdir -p "baselines/$npu/baseline"
            save_series "$data_dir/data.js" \
              "baselines/$npu/baseline/benchmark-data.json"
            if [[ "$STATIC" == true ]]; then
              save_series "bench/static-pm/$target/data.js" \
                "baselines/$npu/baseline/benchmark-data-pm.json"
            fi
          done
      # Cache paths must match the compute jobs' restore path ("baseline").
      - name: Select npu1 baseline
        run: cp -r baselines/npu1/baseline baseline
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: inputs.branch == 'gh-pages'
        with:
          path: baseline
          key: ${{ inputs.static && 'static-baseline-aie2' || 'kernel-bench-baseline-npu1' }}-${{ github.run_id }}
      - name: Select npu2 baseline
        run: |
          rm -rf baseline
          cp -r baselines/npu2/baseline baseline
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: inputs.branch == 'gh-pages'
        with:
          path: baseline
          key: ${{ inputs.static && 'static-baseline-aie2p' || 'kernel-bench-baseline-npu2' }}-${{ github.run_id }}
