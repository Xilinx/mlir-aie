name: Publish kernel results

# Called by nightlyKernelChecks.yml once its legs have uploaded their
# artifacts. Every NPU that produced results is recorded under
# gh-pages:kernel-checks/<npu>/ by utils/kernel_checks/publish.py: one run
# record, the run index, the latest published record (the PR report's
# baseline) and one history file per metric, beside the NPU's catalogue.
# The page reads those files; nothing else writes them.

on:
  workflow_call:

permissions:
  contents: write
  actions: read  # the workflow's runs, to date each record by its start

jobs:
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Lock the whole batch, keeping compute parallel. Queue up to 100
    # publications instead of replacing pending runs. The docs workflow takes
    # this same lock, so it stays a constant both can name.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
      queue: max
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # `pattern`, not `name`: an NPU whose leg produced nothing is skipped
      # rather than failing the other's publication. One match extracts
      # straight into `path`, as `name` would.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: kernel-checks-npu1-${{ github.run_id }}
          path: results/npu1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: kernel-checks-npu2-${{ github.run_id }}
          path: results/npu2

      # Only `turbo` (nightlyKernelChecks.yml's PERF_PMODE) is
      # published: the checks refuse to measure a publishing run in any
      # other mode, and this drops the numbers of one that slipped through.
      # The run is still recorded, unpublished, and the other NPU publishes.
      - name: Read power modes
        run: |
          for npu in npu1 npu2; do
            [[ -f "results/$npu/perf.json" ]] || continue
            pmode=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["preflight"]["pmode"] or "unreadable")' \
              "results/$npu/meta.json")
            if [[ "$pmode" != turbo ]]; then
              echo "::error::$npu was measured in power mode '$pmode', not turbo; its numbers are not published"
              rm "results/$npu/perf.json"
            fi
          done

      # Each record is dated by its run's start, not by when it published
      # (a run can queue for its NPU for hours); `backfill` below brings the
      # records of earlier runs up to that, and fills in what started them.
      - name: List the workflow's runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow=${GITHUB_WORKFLOW_REF%@*}
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/${workflow##*/}/runs?per_page=100" \
            --paginate --jq '.workflow_runs[] | {id, event, run_started_at}' \
            > "$RUNNER_TEMP/runs.jsonl" ||
            echo "::warning::could not list the workflow's runs; records are dated when published"
          started=$(jq -r --argjson id "$GITHUB_RUN_ID" 'select(.id == $id) | .run_started_at' \
            "$RUNNER_TEMP/runs.jsonl" 2>/dev/null || true)
          echo "RUN_STARTED_AT=$started" >> "$GITHUB_ENV"

      - name: Fetch publication branch
        run: git fetch origin gh-pages:gh-pages --depth=1

      # The page and the publisher are copied out before switching branches,
      # since neither is on gh-pages; results/ is untracked and survives the
      # switch. The page is the maintainer dashboard, at dashboard/; the
      # kernel checks' old address redirects there, keeping a link's #view.
      # An NPU directory that still holds github-action-benchmark's data.js
      # is migrated first (once), and an NPU whose leg wrote nothing
      # keeps its previous files. `backfill` is idempotent: it dates and
      # labels every record of a listed run, and drops the numbers of any run
      # charted in a mode other than turbo (the default-mode history
      # migrated from data.js), keeping the record of a run that refused.
      - name: Publish results
        run: |
          cp utils/kernel_checks/index.html "$RUNNER_TEMP/index.html"
          cp utils/kernel_checks/publish.py "$RUNNER_TEMP/publish.py"
          git switch -q gh-pages
          mkdir -p dashboard
          cp "$RUNNER_TEMP/index.html" dashboard/index.html
          python3 "$RUNNER_TEMP/publish.py" redirect --out kernel-checks \
            --to "../dashboard/#view=night"
          for npu in npu1 npu2; do
            dir="kernel-checks/$npu"
            python3 "$RUNNER_TEMP/publish.py" migrate --out "$dir"
            if [[ -f "results/$npu/catalogue.json" ]]; then
              mkdir -p "$dir"
              cp "results/$npu/catalogue.json" "$dir/catalogue.json"
            fi
            if [[ -f "results/$npu/meta.json" ]]; then
              python3 "$RUNNER_TEMP/publish.py" perf --target "$npu" --results "results/$npu" \
                --run-id "$GITHUB_RUN_ID" --run-url "$RUN_URL" --out "$dir" \
                --date "$RUN_STARTED_AT"
            fi
            if [[ -d "$dir/runs" && -s "$RUNNER_TEMP/runs.jsonl" ]]; then
              python3 "$RUNNER_TEMP/publish.py" backfill --out "$dir" \
                --runs "$RUNNER_TEMP/runs.jsonl" --keep-pmode turbo
            fi
          done
          git add -A kernel-checks dashboard
          git diff --cached --quiet || git -c user.name=kernel-checks \
            -c user.email=github@users.noreply.github.com \
            commit -q -m "Publish kernel checks for ${GITHUB_SHA:0:10}"
          git checkout -q -

      - name: Push
        run: git push origin gh-pages:gh-pages

      # Cache exactly what was just published, per NPU, for the PR
      # comparisons; the report job restores it under the same path.
      - name: Collect baselines
        run: |
          for npu in npu1 npu2; do
            file="kernel-checks/$npu/latest.json"
            mkdir -p "baselines/$npu/baseline"
            if git cat-file -e "gh-pages:$file" 2>/dev/null; then
              git show "gh-pages:$file" > "baselines/$npu/baseline/latest.json"
            else
              echo "no gh-pages:$file yet -- nothing to cache as a baseline"
            fi
          done
      - name: Select npu1 baseline
        run: rm -rf baseline && cp -r baselines/npu1/baseline baseline
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: baseline
          key: kernel-checks-baseline-npu1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Select npu2 baseline
        run: rm -rf baseline && cp -r baselines/npu2/baseline baseline
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: baseline
          key: kernel-checks-baseline-npu2-${{ github.run_id }}-${{ github.run_attempt }}
