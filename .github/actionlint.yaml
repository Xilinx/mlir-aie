# actionlint cannot see this repository's self-hosted runners, so every
# `runs-on` naming one reads as an unknown label. Declare them here; a label
# missing from this list is then a real typo rather than noise.
self-hosted-runner:
  labels:
    - aie2-4col      # NPU1, 4 columns
    - aie2p-8col     # NPU2, 8 columns
    - bench          # runners reserved for timing
    - devlab-dispatch
    - nightly-backup   # the bench runner a nightly falls back to (pickBenchRunner.yml)
    - nightly-primary  # the bench runner a nightly runs on while it is up
    - npu2
    - ryzenai
    - strix-halo
    - ubuntu-26.04   # Hosted image not yet known to actionlint v1.7.12
    - ubuntu-vitis   # Vitis toolchain image

# GitHub supports concurrency.queue, but actionlint v1.7.12 does not yet.
# test/test_kernel_workflows.py checks these queues and their cancellation policy.
paths:
  .github/workflows/{generateDocs,nightlyKernelChecks,publishKernelResults,nightlyComponentChecks,publishCiHealth,modelBasedTests,nightlyCodeHealth}.yml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
