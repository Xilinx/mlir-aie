minimum_pre_commit_version: '4.6.0'
default_install_hook_types: [pre-commit, pre-push]

repos:
- repo: https://github.com/kynan/nbstripout
  rev: 34071b78c181af3bf5af955c1426466e096fc3db  # frozen: 0.9.1
  hooks:
    - id: nbstripout
      args: [--drop-empty-cells]

# Formatting hooks (run on pre-push to catch issues before CI)
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: f4d7745e17a28aad7eed2f4874ca8d1568c11c4c  # frozen: v22.1.8
  hooks:
    - id: clang-format
      types_or: [c, c++]
      stages: [pre-push]
      # Exclude generated files and third-party / vendored code (matches black)
      exclude: |
        (?x)^(
          third_party/.*|
          (_)?build.*/.*|
          (my_)?install.*/.*|
          sandbox.*/.*|
          llvm.*/.*|
          cmakeModules.*/.*|
          ironenv/.*
        )$

- repo: https://github.com/psf/black
  rev: 87928e6d6761a4a6d22250e1fee5601b3998086e  # frozen: 26.5.1
  hooks:
    - id: black
      stages: [pre-push]
      # Exclude generated files and third-party code
      exclude: |
        (?x)^(
          third_party/.*|
          (_)?build.*/.*|
          (my_)?install.*/.*|
          sandbox.*/.*|
          llvm.*/.*|
          cmakeModules.*/.*|
          ironenv/.*
        )$

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 65dbdb59d2f2d9c3bdc343c566821ad3319ddaa3  # frozen: v0.16.3
  hooks:
    - id: ruff-check
      stages: [pre-push]
      # pre-commit passes changed files as explicit paths, and ruff lints an
      # explicitly-passed file even if it is outside ruff.toml's `include`
      # allowlist -- so without this filter the hook reports on files the
      # project has not opted into linting yet (e.g. python/dialects,
      # test/**). Mirror ruff.toml's `include` here so the hook and a plain
      # `ruff check` (what CI runs) see exactly the same file set. Keep this
      # in sync with ruff.toml `include`.
      files: |
        (?x)^(
          python/(iron|utils|helpers|compiler)/.*\.py|
          programming_examples/(algorithms|basic|getting_started|vision)/.*\.py|
          programming_examples/lit\.cfg\.py|
          programming_examples/ml/(block_datatypes|mobilenet|bottleneck|conv2d|conv2d_14x14|eltwise|eltwise_unary|magika|norm|resnet|rope|scale_shift|softmax|swiglu)/.*\.py
        )$

# Baseline hygiene: validators run on every commit, fixers gated to pre-push
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
    - id: check-yaml
      exclude: &generated_exclude |
        (?x)^(
          third_party/.*|
          (_)?build.*/.*|
          (my_)?install.*/.*|
          sandbox.*/.*|
          llvm.*/.*|
          cmakeModules.*/.*|
          ironenv/.*
        )$
    - id: check-toml
    - id: check-json
    - id: check-merge-conflict
    - id: check-case-conflict
    - id: check-added-large-files
      args: [--maxkb=1024]
    - id: end-of-file-fixer
      stages: [pre-push]
      exclude: *generated_exclude
    - id: trailing-whitespace
      stages: [pre-push]
      exclude: *generated_exclude
    - id: mixed-line-ending
      stages: [pre-push]
      args: [--fix=lf]
      exclude: *generated_exclude

# Regenerate hash-pinned lockfiles when their source manifests change.
# Only fires if you've staged one of the source files below; if uv is missing
# locally the hook fails with a clear install hint (the script does the check).
- repo: local
  hooks:
    - id: regenerate-lockfiles
      name: Regenerate hash-pinned lockfiles
      language: script
      entry: utils/regenerate_lockfiles.sh
      pass_filenames: false
      files: ^(python/requirements_dev\.txt|utils/mlir_(aie_)?wheels/(requirements|ci-tools)\.(in|txt))$

    # REUSE compliance: every file must have a license/copyright notice (either
    # inline or declared in REUSE.toml). Scoped to the files being pushed via
    # `reuse lint-file` so an unrelated dirty working tree doesn't block a push;
    # the authoritative whole-repo `reuse lint` still runs in CI. Runs before
    # check-copyright-format, which then validates the notice wording.
    - id: reuse-lint
      name: Check REUSE compliance
      language: python
      entry: reuse lint-file
      additional_dependencies: ['reuse[charset-normalizer]==6.2.0']
      pass_filenames: true
      stages: [pre-push]

    # Format gate on top of REUSE: every copyright notice must match an approved
    # canonical form (see utils/check_copyright_format.py). REUSE only checks that
    # a notice exists, not how it is written, so this catches stray commas, the
    # "AMD Inc." shorthand, "(c) Copyright" ordering, etc. Scoped to the pushed
    # files here; the script scans the whole repo when invoked with no args (CI).
    - id: check-copyright-format
      name: Check copyright notice format
      language: python
      entry: python utils/check_copyright_format.py
      additional_dependencies: ['reuse[charset-normalizer]==6.2.0']
      pass_filenames: true
      stages: [pre-push]

    # Static analysis for C++, growing one file at a time (see .clang-tidy and
    # docs/CONTRIBUTING.md's clang-tidy section). Unlike clang-format this
    # needs a real build (compile_commands.json) to resolve headers, so it
    # can't run as a bare per-file text hook -- utils/run_clang_tidy.sh finds
    # the build (MLIR_AIE_BUILD_DIR, defaulting to build/) and fails with a
    # clear setup hint if there isn't one. `files:` below must be kept in
    # sync with the file list in lintAndFormat.yml's clang-tidy step (same
    # convention ruff-check uses to stay in sync with ruff.toml's `include`).
    - id: clang-tidy
      name: clang-tidy
      language: python
      additional_dependencies: ['clang-tidy==22.1.8']
      entry: utils/run_clang_tidy.sh
      files: |
