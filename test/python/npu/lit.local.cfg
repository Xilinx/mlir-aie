#
# Runtime-agnostic on-device Python tests. These dispatch through IRON's
# DEFAULT_TENSOR_CLASS, so the same test body runs under either host runtime;
# the per-RUN-line %run_on_npu*_xrt% / %run_on_npu2_hrx% substitutions select
# (and gate) the backend. Genuinely XRT-internal tests stay in ../npu-xrt.
if not config.enable_python_tests:
    config.unsupported = True

config.excludes.add("conftest.py")
config.excludes.add("aie_design.py")

# Serialize with the other on-device Python tests: XRT and HRX dispatch to the
# same NPU, so they must not run concurrently.
config.parallelism_group = "npu-xrt"
