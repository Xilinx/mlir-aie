# npu-xrt makes ".py" a test suffix, so the shared library would otherwise be
# collected as four failing tests. Excluding the package here is what lets those
# modules be plain Python -- the alternative is a per-file `REQUIRES: dont_run`
# plus a dummy RUN line, which is easy to forget on the next module added.
config.excludes.add("pmlib")

# Driver scripts invoked from a RUN line (hw/one_slot_iron_api.lit,
# hw/pingpong_iron_api.lit), not tests in their own right -- same reasoning
# as pmlib above.
config.excludes.add("iron_api_one_slot.py")
config.excludes.add("iron_api_pingpong.py")
