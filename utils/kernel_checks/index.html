<!--
  The Nightly Kernel Checks page, installed as kernel-checks/index.html on the
  publication branch by publishKernelResults.yml. It reads the data.js that
  github-action-benchmark writes under kernel-checks/<npu>/, where each power
  mode is its own suite, "aie_kernels (<npu>, <mode>)". One chart per NPU,
  kernel case and metric, with a line per power mode. The catalogue view
  reads the kernel-checks/<npu>/catalogue.json that
  utils/kernel_checks/catalogue.py writes.
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nightly Kernel Checks</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; color: #24292f; }
    [hidden] { display: none !important; }
    header { padding: 12px 20px; border-bottom: 1px solid #d0d7de; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    #status { font-size: 13px; color: #57606a; }
    #controls { position: sticky; top: 0; z-index: 1; background: #f6f8fa; border-bottom: 1px solid #d0d7de;
                padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; font-size: 14px; }
    fieldset { border: 0; padding: 0; margin: 0; display: flex; gap: 10px; align-items: center; }
    legend { float: left; font-weight: 600; margin-right: 6px; }
    #charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 16px; padding: 16px 20px; }
    .chart { border: 1px solid #d0d7de; border-radius: 6px; padding: 8px; min-height: 260px; }
    .chart h2 { font-size: 13px; font-weight: 600; margin: 0 0 4px; overflow-wrap: anywhere; }
    .chart .delta { font-weight: 400; color: #57606a; }
    .chart .delta.worse { color: #cf222e; }
    .chart .delta.better { color: #1a7f37; }
    #empty { padding: 20px; color: #57606a; }
    #views { font-size: 14px; margin: 4px 0; display: flex; gap: 12px; }
    #catalogue { padding: 10px 20px; font-size: 14px; }
    #catalogue p { color: #57606a; margin: 4px 0 10px; }
    #catalogue table { border-collapse: collapse; width: 100%; }
    #catalogue th, #catalogue td { border-bottom: 1px solid #d0d7de; padding: 4px 8px; text-align: left; vertical-align: top; }
    #catalogue th { position: sticky; top: 0; background: #f6f8fa; }
    #catalogue .none { color: #8c959f; }
    #catalogue .pass { color: #1a7f37; }
    #catalogue .fail { color: #cf222e; }
  </style>
</head>
<body>
  <header>
    <h1>Nightly Kernel Checks</h1>
    <div id="views">
      <label><input type="radio" name="view" value="charts" checked> Charts</label>
      <label><input type="radio" name="view" value="catalogue"> Catalogue</label>
    </div>
    <div id="status">Loading&hellip;</div>
  </header>
  <form id="controls" onsubmit="return false">
    <fieldset id="npus"><legend>NPU</legend></fieldset>
    <fieldset id="modes"><legend>Power mode</legend></fieldset>
    <label>Metric <select id="metric"></select></label>
    <label>Kernel <input id="kernel" type="search" placeholder="substring, e.g. softmax or /bfloat16" size="28"></label>
    <label>Sort <select id="sort">
      <option value="name">name</option>
      <option value="worse">latest change, worst first</option>
      <option value="better">latest change, best first</option>
    </select></label>
  </form>
  <div id="charts"></div>
  <div id="empty" hidden>No series match these filters.</div>
  <section id="catalogue" hidden>
    <p id="catalogue-status">Loading&hellip;</p>
    <label>Kernel <input id="catalogue-filter" type="search" placeholder="factory, family or summary" size="28"></label>
    <table>
      <thead><tr id="catalogue-head"><th>Family</th><th>Kernel</th><th>Summary</th><th>Source</th></tr></thead>
      <tbody id="catalogue-rows"></tbody>
    </table>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.2/dist/Chart.min.js"></script>
  <script>
    'use strict';
    const NPUS = ['npu1', 'npu2'];
    const SUITE = /^aie_kernels \((npu\d+), (.+)\)$/;
    const PALETTE = ['#0969da', '#cf222e', '#1a7f37', '#8250df', '#bf8700', '#57606a'];
    const REPO = 'https://github.com/Xilinx/mlir-aie';

    // Every metric is smaller-is-better (customSmallerIsBetter).
    async function load(npu) {
      const res = await fetch(`${npu}/data.js`, { cache: 'no-cache' });
      if (!res.ok) return null;
      const text = await res.text();
      return JSON.parse(text.replace(/^\s*window\.BENCHMARK_DATA\s*=\s*/, '').replace(/;\s*$/, ''));
    }

    // series key "npu|case|metric" -> {npu, kase, metric, unit, byMode: mode -> [point]}
    function collect(loaded) {
      const series = new Map();
      const observations = [];
      for (const [npu, data] of loaded) {
        for (const [suite, entries] of Object.entries(data.entries)) {
          const m = SUITE.exec(suite);
          const mode = m && m[1] === npu ? m[2] : suite;
          for (const { commit, date, benches } of entries) {
            const id = observations.length;
            observations.push({ id, npu, commit, date });
            for (const row of benches) {
              const cut = row.name.lastIndexOf('/');
              const kase = row.name.slice(0, cut), metric = row.name.slice(cut + 1);
              const key = `${npu}|${kase}|${metric}`;
              let s = series.get(key);
              if (!s) series.set(key, s = { key, npu, kase, metric, unit: row.unit, byMode: new Map() });
              if (!s.byMode.has(mode)) s.byMode.set(mode, []);
              s.byMode.get(mode).push({ id, date, row });
            }
          }
        }
      }
      for (const s of series.values()) {
        for (const points of s.byMode.values()) points.sort((a, b) => a.date - b.date);
      }
      const order = observations.sort((a, b) => a.date - b.date);
      return { series: [...series.values()], order };
    }

    // Relative change between the last two points of each shown mode; the
    // largest one, so a regression in any mode sorts the chart up.
    function latestChange(s, modes) {
      let worst = null;
      for (const mode of modes) {
        const pts = s.byMode.get(mode);
        if (!pts || pts.length < 2) continue;
        const [a, b] = pts.slice(-2).map(p => p.row.value);
        if (!a) continue;
        const d = (b - a) / a;
        if (worst === null || d > worst) worst = d;
      }
      return worst;
    }

    const $ = id => document.getElementById(id);
    let db, modeColor, observer, charts = [];

    function checked(fieldset) {
      return [...fieldset.querySelectorAll('input:checked')].map(i => i.value);
    }

    function addBoxes(fieldset, values) {
      for (const v of values) {
        const label = document.createElement('label');
        const box = Object.assign(document.createElement('input'), { type: 'checkbox', value: v });
        label.append(box, ' ', v);
        fieldset.append(label);
      }
    }

    function readHash() {
      return Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
    }

    function currentView() {
      return document.querySelector('input[name=view]:checked').value;
    }

    function applyView() {
      const view = readHash().view === 'catalogue' ? 'catalogue' : 'charts';
      document.querySelector(`input[name=view][value=${view}]`).checked = true;
      $('catalogue').hidden = view !== 'catalogue';
      for (const id of ['controls', 'charts', 'status']) $(id).hidden = view === 'catalogue';
      if (view === 'catalogue') $('empty').hidden = true;
    }

    // One row per factory; per NPU, what it offers there and what the nightly
    // extensive sweep and performance checks made of it.
    function npuCell(npu, k) {
      const td = document.createElement('td');
      if (!k || !k.builds.length) {
        td.className = 'none';
        td.textContent = '\u2014';
        td.title = 'not offered on this NPU';
        return td;
      }
      td.title = k.builds.join('\n');
      td.append(`${k.builds.length} build${k.builds.length > 1 ? 's' : ''}`);
      const verdict = document.createElement('span');
      if (k.failed.length) {
        verdict.className = 'fail';
        verdict.textContent = ` \u00b7 ${k.failed.length} failing`;
        verdict.title = k.failed.join('\n');
      } else if (k.passed) {
        verdict.className = 'pass';
        verdict.textContent = ` \u00b7 ${k.passed} case${k.passed > 1 ? 's' : ''} pass`;
      } else {
        verdict.className = 'none';
        verdict.textContent = ' \u00b7 not checked on hardware';
      }
      td.append(verdict);
      if (k.timed) {
        const a = document.createElement('a');
        a.href = '#' + new URLSearchParams({ view: 'charts', npu, metric: 'all', kernel: `${k.factory}/` });
        a.textContent = 'charts';
        td.append(' \u00b7 ', a);
      }
      return td;
    }

    function renderCatalogue(catalogues) {
      const status = $('catalogue-status');
      if (!catalogues.length) {
        status.textContent = 'No catalogue has been published yet.';
        return;
      }
      status.textContent = catalogues.map(c =>
        `${c.npu} (${c.arch}): ${c.commit ? c.commit.slice(0, 7) : 'unknown commit'}, ${new Date(c.date).toString()}`
      ).join(' \u00b7 ');
      for (const c of catalogues) {
        const th = document.createElement('th');
        th.textContent = c.npu;
        $('catalogue-head').append(th);
      }
      const byNpu = catalogues.map(c => new Map(c.kernels.map(k => [k.factory, k])));
      const rows = new Map();
      for (const c of catalogues) for (const k of c.kernels) if (!rows.has(k.factory)) rows.set(k.factory, k);
      const sorted = [...rows.values()].sort((a, b) =>
        a.family.localeCompare(b.family) || a.factory.localeCompare(b.factory));
      const commit = catalogues.find(c => c.commit)?.commit || 'main';
      const trs = sorted.map(k => {
        const tr = document.createElement('tr');
        const source = document.createElement('td');
        k.sources.forEach((src, i) => {
          const a = document.createElement('a');
          a.href = `${REPO}/blob/${commit}/aie_kernels/${src}`;
          a.textContent = src;
          source.append(...(i ? [', ', a] : [a]));
        });
        tr.append(...[k.family, k.factory, k.summary].map(text => {
          const td = document.createElement('td');
          td.textContent = text;
          return td;
        }), source, ...catalogues.map((c, i) => npuCell(c.npu, byNpu[i].get(k.factory))));
        tr.search = `${k.family} ${k.factory} ${k.summary}`.toLowerCase();
        return tr;
      });
      $('catalogue-rows').append(...trs);
      $('catalogue-filter').addEventListener('input', () => {
        const q = $('catalogue-filter').value.trim().toLowerCase();
        for (const tr of trs) tr.hidden = !tr.search.includes(q);
      });
    }

    function writeHash() {
      const p = new URLSearchParams({
        view: currentView(),
        npu: checked($('npus')).join(','), mode: checked($('modes')).join(','),
        metric: $('metric').value, kernel: $('kernel').value, sort: $('sort').value,
      });
      history.replaceState(null, '', '#' + p);
    }

    function draw(el, s, modes) {
      const order = db.order.filter(c => c.npu === s.npu);
      const labels = order.map(c => c.commit.id.slice(0, 7));
      const index = new Map(order.map((c, i) => [c.id, i]));
      const datasets = modes.filter(m => s.byMode.has(m)).map(mode => {
        const values = new Array(labels.length).fill(null), rows = new Array(labels.length);
        for (const p of s.byMode.get(mode)) {
          const i = index.get(p.id);
          values[i] = p.row.value;
          rows[i] = p.row;
        }
        return { label: mode, data: values, rows, fill: false, spanGaps: true, lineTension: 0,
                 borderColor: modeColor.get(mode), backgroundColor: modeColor.get(mode), pointRadius: 2 };
      });
      charts.push(new Chart(el.querySelector('canvas'), {
        type: 'line',
        data: { labels, datasets },
        options: {
          animation: false,
          scales: {
            xAxes: [{ scaleLabel: { display: true, labelString: 'nightly run (commit)' } }],
            yAxes: [{ scaleLabel: { display: true, labelString: s.unit }, ticks: { beginAtZero: true } }],
          },
          tooltips: {
            mode: 'index', intersect: false,
            callbacks: {
              afterTitle: items => {
                const c = order[items[0].index];
                return `\n${c.commit.message.split('\n')[0]}\n${new Date(c.date).toString()}`;
              },
              label: (item, data) => {
                const b = data.datasets[item.datasetIndex].rows[item.index];
                return `${data.datasets[item.datasetIndex].label}: ${item.value} ${s.unit}` + (b && b.range ? ` (${b.range})` : '');
              },
            },
          },
          onClick: (_e, active) => {
            if (active.length) window.open(order[active[0]._index].commit.url, '_blank', 'noopener');
          },
        },
      }));
    }

    function render() {
      writeHash();
      observer && observer.disconnect();
      charts.forEach(c => c.destroy());
      charts = [];
      $('charts').replaceChildren();
      const npus = checked($('npus')), modes = checked($('modes'));
      const metric = $('metric').value, kernel = $('kernel').value.trim().toLowerCase();
      const shown = db.series.filter(s =>
        npus.includes(s.npu) && (metric === 'all' || s.metric === metric) &&
        s.kase.toLowerCase().includes(kernel) && modes.some(m => s.byMode.has(m)));
      const change = new Map(shown.map(s => [s.key, latestChange(s, modes)]));
      const sort = $('sort').value;
      shown.sort((a, b) => {
        if (sort !== 'name') {
          const x = change.get(a.key), y = change.get(b.key);
          if (x !== y) {
            if (x === null) return 1;
            if (y === null) return -1;
            return sort === 'worse' ? y - x : x - y;
          }
        }
        return a.key.localeCompare(b.key);
      });
      $('empty').hidden = shown.length > 0 || currentView() === 'catalogue';
      // Charts draw as they scroll into view: a full sweep is thousands.
      observer = new IntersectionObserver(seen => {
        for (const { isIntersecting, target } of seen) {
          if (!isIntersecting) continue;
          observer.unobserve(target);
          draw(target, target.series, modes);
        }
      }, { rootMargin: '400px' });
      for (const s of shown) {
        const el = document.createElement('div');
        el.className = 'chart';
        const title = document.createElement('h2');
        title.textContent = `${s.npu} · ${s.kase} · ${s.metric} `;
        const d = change.get(s.key);
        if (d !== null) {
          const span = document.createElement('span');
          span.className = 'delta' + (d > 0.005 ? ' worse' : d < -0.005 ? ' better' : '');
          span.textContent = `${d > 0 ? '+' : ''}${(100 * d).toFixed(1)}%`;
          title.append(span);
        }
        el.append(title, document.createElement('canvas'));
        el.series = s;
        $('charts').append(el);
        observer.observe(el);
      }
      $('status').textContent = `${shown.length} of ${db.series.length} series · last update ${db.updated}`;
    }

    (async () => {
      for (const radio of document.querySelectorAll('input[name=view]')) {
        radio.addEventListener('change', () => {
          const p = new URLSearchParams(location.hash.slice(1));
          p.set('view', radio.value);
          location.hash = p;
        });
      }
      window.addEventListener('hashchange', applyView);
      applyView();
      const catalogues = await Promise.all(NPUS.map(n =>
        fetch(`${n}/catalogue.json`, { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null)));
      renderCatalogue(catalogues.filter(c => c));
      const loaded = (await Promise.all(NPUS.map(async n => [n, await load(n).catch(() => null)])))
        .filter(([, data]) => data);
      if (!loaded.length) {
        $('status').textContent = 'No results have been published yet.';
        return;
      }
      db = collect(loaded);
      db.updated = new Date(Math.max(...loaded.map(([, d]) => d.lastUpdate))).toString();
      const modes = [...new Set(db.series.flatMap(s => [...s.byMode.keys()]))].sort();
      const metrics = [...new Set(db.series.map(s => s.metric))].sort();
      modeColor = new Map(modes.map((m, i) => [m, PALETTE[i % PALETTE.length]]));
      addBoxes($('npus'), loaded.map(([n]) => n));
      addBoxes($('modes'), modes);
      for (const m of ['all', ...metrics]) $('metric').append(new Option(m, m));

      // The hash holds the filters, so a link reproduces the view.
      function applyHash() {
        const want = readHash();
        for (const [key, id] of [['npu', 'npus'], ['mode', 'modes']]) {
          const on = want[key] !== undefined ? want[key].split(',') : null;
          for (const box of $(id).querySelectorAll('input')) box.checked = !on || on.includes(box.value);
        }
        $('metric').value = metrics.includes(want.metric) || want.metric === 'all' ? want.metric
          : metrics.includes('cycles') ? 'cycles' : 'all';
        $('kernel').value = want.kernel || '';
        $('sort').value = ['name', 'worse', 'better'].includes(want.sort) ? want.sort : 'name';
      }
      applyHash();
      window.addEventListener('hashchange', () => { applyHash(); render(); });
      $('controls').addEventListener('change', render);
      let typing;
      $('kernel').addEventListener('input', () => { clearTimeout(typing); typing = setTimeout(render, 200); });
      render();
    })();
  </script>
</body>
</html>
